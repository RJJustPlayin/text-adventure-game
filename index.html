<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Legacy</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #202936 0%, #080b10 70%);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}
.container { width: 90%; max-width: 700px; text-align: center; padding: 20px 0; }
.logo { font-size: clamp(42px, 8vw, 75px); font-weight: 900; letter-spacing: 3px; margin-bottom: 5px; }
.subtitle { color: #9da8b7; font-size: 18px; letter-spacing: 2px; margin-bottom: 30px; }
.menu { display: flex; flex-direction: column; gap: 14px; }
.menu-button {
    width: 100%; padding: 18px; background: #151c26; color: white;
    border: 1px solid #354151; border-radius: 8px; font-size: 18px;
    font-weight: bold; cursor: pointer; transition: transform .15s, background .15s, border-color .15s;
}
.menu-button:hover { background: #222d3b; border-color: #66778c; transform: translateY(-2px); }
.menu-button:active { transform: translateY(0); }
.footer { margin-top: 40px; color: #687586; font-size: 13px; letter-spacing: 1px; }
.version { margin-top: 12px; color: #465160; font-size: 12px; }
.page-title { font-size: clamp(30px, 7vw, 48px); font-weight: 900; margin-bottom: 8px; }
.creation-panel {
    background: #151c26; border: 1px solid #354151; border-radius: 12px;
    padding: 25px; text-align: left; max-height: 75vh; overflow-y: auto;
}
.creation-panel h2 { margin: 25px 0 15px; font-size: 16px; color: #dce3ec; border-bottom: 1px solid #303b49; padding-bottom: 8px; }
.creation-panel h2:first-child { margin-top: 0; }
.creation-panel label { display: block; margin-top: 13px; margin-bottom: 6px; color: #aeb8c6; font-size: 14px; }
.creation-panel input, .creation-panel select {
    width: 100%; padding: 12px; background: #0e141c; color: white;
    border: 1px solid #394656; border-radius: 7px; font-size: 15px;
}
.creation-panel input:focus, .creation-panel select:focus { outline: none; border-color: #718197; }
.creation-panel input[type="color"] { height: 48px; padding: 4px; cursor: pointer; }
.rating-box { background: #0e141c; border: 1px solid #303b49; border-radius: 10px; padding: 18px; margin-top: 10px; }
.starting-overall { display: flex; justify-content: space-between; align-items: center; font-size: 18px; }
.starting-overall strong { font-size: 36px; }
.small-text { color: #7f8b9b; font-size: 13px; }
.back-button { width: 100%; padding: 13px; margin-top: 10px; background: transparent; border: 1px solid #394656; color: #aeb8c6; border-radius: 7px; cursor: pointer; }
.back-button:hover { background: #222b38; color: white; }
.random-box { background: #0e141c; border: 1px solid #303b49; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
.random-status { color: #aeb8c6; font-size: 13px; margin-top: 8px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-card { background: #0e141c; border: 1px solid #303b49; border-radius: 8px; padding: 12px; }
.stat-card span { display: block; color: #7f8b9b; font-size: 12px; margin-bottom: 4px; }
.color-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .color-row, .stat-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
    <div class="logo">🏈 FOOTBALL LEGACY</div>
    <div class="subtitle">ONE PLAYER. ONE CAREER. ONE LEGACY.</div>
    <div class="menu">
        <button class="menu-button" onclick="startCareer()">START NEW CAREER</button>
        <button class="menu-button" onclick="loadCareer()">LOAD CAREER</button>
        <button class="menu-button" onclick="settings()">SETTINGS</button>
    </div>
    <div class="footer">HIGH SCHOOL → COLLEGE → NFL → RETIREMENT<div class="version">Football Legacy • Career Simulator</div></div>
</div>
<script>
const archetypes = {
    QB:["Pocket Passer","Field General","Scrambler","Dual Threat"],
    RB:["Power Back","Elusive Back","Receiving Back","Balanced Back"],
    FB:["Blocking Back","Power Runner","Utility Back"],
    WR:["Deep Threat","Route Technician","Possession Receiver","YAC Receiver"],
    TE:["Vertical Threat","Blocking TE","Possession TE","Balanced TE"],
    OT:["Pass Protector","Run Blocker","Athletic Tackle","Balanced Tackle"],
    OG:["Power Guard","Pulling Guard","Pass Protector","Balanced Guard"],
    C:["Power Center","Field General","Pass Protector","Balanced Center"],
    EDGE:["Speed Rusher","Power Rusher","Run Defender","Complete Edge"],
    DT:["Run Stuffer","Power Rusher","Interior Pass Rusher","Balanced DT"],
    "Mike LB":["Run Stopper","Field General","Blitzing Linebacker","Balanced Mike"],
    "Sam LB":["Edge Setter","Coverage Linebacker","Blitzer","Balanced Sam"],
    "Will LB":["Coverage Specialist","Speed Linebacker","Blitzer","Balanced Will"],
    CB:["Man Coverage","Zone Corner","Press Corner","Ball Hawk"],
    FS:["Center Fielder","Ball Hawk","Zone Safety","Balanced Free Safety"],
    SS:["Box Safety","Enforcer","Man Safety","Balanced Strong Safety"],
    K:["Power Kicker","Accuracy Kicker","Clutch Kicker"],
    P:["Power Punter","Precision Punter","Directional Punter"]
};

const schoolNames = ["Lincoln","Central","Jefferson","Roosevelt","Washington","Franklin","Westview","East Ridge","North Valley","Southside"];
const mascots = ["Tigers","Eagles","Panthers","Bulldogs","Wolves","Falcons","Knights","Lions","Hawks","Raiders"];
const cities = ["Buffalo","Rochester","Syracuse","Albany","New York City","Cleveland","Detroit","Columbus","Pittsburgh","Charlotte"];
const stadiums = ["Memorial Stadium","Legacy Field","Victory Stadium","Tiger Stadium","Eagle Field","Warrior Stadium","Panther Park"];
const coachFirstNames = ["James","Marcus","Derrick","Anthony","Michael","Robert","Daniel","Andre","Chris","Kevin"];
const coachLastNames = ["Carter","Williams","Johnson","Davis","Thompson","Mitchell","Robinson","Bennett","Jackson","Miller"];
const schemes = ["Balanced","Spread","Pro Style","Air Raid","Power Run","West Coast"];
const philosophies = ["Player Development","Win Now","Discipline","Player Friendly","Tough Love","Analytics"];
const personalities = ["Players' Coach","Demanding","Motivator","Quiet Leader","Old School","Innovator"];

let careerData = {};
let schoolRandomUses = 0;
let coachRandomUses = 0;

function startCareer() {
    document.querySelector(".container").innerHTML = `
        <div class="page-title">CREATE YOUR PLAYER</div>
        <div class="subtitle">Your career begins here.</div>
        <div class="creation-panel">
            <h2>PLAYER INFORMATION</h2>
            <label>First Name</label><input id="firstName" type="text" placeholder="First Name">
            <label>Last Name</label><input id="lastName" type="text" placeholder="Last Name">
            <label>Birthday</label><input id="birthday" type="date">
            <label>Hometown</label><input id="hometown" type="text" placeholder="Hometown">
            <label>State</label>
            <select id="state"><option value="">Select State</option><option>New York</option><option>California</option><option>Texas</option><option>Florida</option><option>Georgia</option><option>Ohio</option><option>Pennsylvania</option><option>Michigan</option><option>New Jersey</option><option>North Carolina</option></select>
            <label>Handedness</label><select id="handedness"><option>Right</option><option>Left</option></select>
            <h2>PHYSICAL BUILD</h2>
            <label>Height</label><input id="height" type="text" placeholder="Example: 5'8">
            <label>Weight</label><input id="weight" type="number" min="1" max="500" placeholder="Weight in lbs">
            <label>Jersey Number</label><input id="jersey" type="number" min="0" max="99" placeholder="1">
            <h2>POSITION</h2>
            <select id="position" onchange="updatePosition()">
                <option value="">Select Position</option><option>QB</option><option>RB</option><option>FB</option><option>WR</option><option>TE</option><option>OT</option><option>OG</option><option>C</option><option>EDGE</option><option>DT</option><option>Mike LB</option><option>Sam LB</option><option>Will LB</option><option>CB</option><option>FS</option><option>SS</option><option>K</option><option>P</option><option value="RANDOM">🎲 Random Position</option>
            </select>
            <div id="archetypeBox"><label>Archetype</label><select id="archetype"><option>Select a position first</option></select></div>
            <h2>STARTING RATINGS</h2>
            <div class="rating-box"><div class="starting-overall">OVERALL <strong>60</strong></div><p>You have <strong>12</strong> attribute points to allocate.</p><p class="small-text">Your archetype provides a small starting boost. Every player begins at 60 OVR.</p></div>
            <button class="menu-button" onclick="createPlayer()">CREATE PLAYER</button>
            <button class="back-button" onclick="location.reload()">← BACK</button>
        </div>`;
}

function updatePosition() {
    const position = document.getElementById("position").value;
    const select = document.getElementById("archetype");
    select.innerHTML = "";
    if (position === "RANDOM") {
        const positions = Object.keys(archetypes);
        document.getElementById("position").value = positions[Math.floor(Math.random()*positions.length)];
        updatePosition();
        return;
    }
    if (!archetypes[position]) { select.innerHTML = '<option>Select a position first</option>'; return; }
    archetypes[position].forEach(a => { const option=document.createElement("option"); option.value=a; option.textContent=a; select.appendChild(option); });
}

function value(id) { return document.getElementById(id).value.trim(); }
function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function randomInt(min,max) { return Math.floor(Math.random()*(max-min+1))+min; }

function createPlayer() {
    const required = [["firstName","First Name"],["lastName","Last Name"],["birthday","Birthday"],["hometown","Hometown"],["state","State"],["height","Height"],["weight","Weight"],["jersey","Jersey Number"]];
    const missing = required.filter(([id]) => !value(id)).map(([,label]) => label);
    const position = value("position");
    if (!position || position === "RANDOM") missing.push("Position");
    if (!value("archetype") || value("archetype") === "Select a position first") missing.push("Archetype");
    if (missing.length) { alert("Please complete: " + missing.join(", ")); return; }
    const weight = Number(value("weight"));
    if (weight < 1 || weight > 500) { alert("Weight must be between 1 and 500 lbs."); return; }
    const jersey = Number(value("jersey"));
    if (jersey < 0 || jersey > 99) { alert("Jersey number must be between 0 and 99."); return; }
    careerData.player = {
        firstName:value("firstName"), lastName:value("lastName"), birthday:value("birthday"), hometown:value("hometown"), state:value("state"), handedness:value("handedness"), height:value("height"), weight, jersey, position, archetype:value("archetype"), overall:60, attributePoints:12, classYear:"Freshman", league:"High School", level:"JV"
    };
    schoolRandomUses = 0;
    coachRandomUses = 0;
    renderSchoolCreation();
}

function renderSchoolCreation() {
    document.querySelector(".container").innerHTML = `
        <div class="page-title">CREATE YOUR SCHOOL</div>
        <div class="subtitle">Build your high-school football program.</div>
        <div class="creation-panel">
            <div class="random-box"><button class="menu-button" onclick="randomSchool()">🎲 RANDOMLY GENERATE SCHOOL</button><div id="schoolRandomStatus" class="random-status">You get 3 regenerations after the initial random generation.</div></div>
            <h2>SCHOOL INFORMATION</h2>
            <label>School Name</label><input id="schoolName" placeholder="Example: Lincoln High School">
            <label>City</label><input id="schoolCity" placeholder="City">
            <label>State</label><input id="schoolState" placeholder="State">
            <label>Mascot</label><input id="schoolMascot" placeholder="Tigers">
            <label>Stadium Name</label><input id="stadiumName" placeholder="Memorial Stadium">
            <h2>SCHOOL COLORS</h2>
            <div class="color-row"><div><label>Primary</label><input id="primaryColor" type="color" value="#1e3a5f"></div><div><label>Secondary</label><input id="secondaryColor" type="color" value="#ffffff"></div><div><label>Accent</label><input id="accentColor" type="color" value="#d4af37"></div></div>
            <h2>PROGRAM</h2>
            <label>School Strength</label><select id="schoolStrength"><option value="1">⭐ Rebuilding</option><option value="2">⭐⭐ Developing</option><option value="3" selected>⭐⭐⭐ Competitive</option><option value="4">⭐⭐⭐⭐ State Contender</option><option value="5">⭐⭐⭐⭐⭐ National Powerhouse</option></select>
            <label>Rival School</label><input id="rivalSchool" placeholder="Optional fictional rival">
            <button class="menu-button" onclick="saveSchool()">CONTINUE TO COACH</button>
            <button class="back-button" onclick="startCareer()">← BACK TO PLAYER</button>
        </div>`;
}

function randomSchool() {
    const school = { name:pick(schoolNames)+" High School", city:pick(cities), state:pick(["New York","Ohio","Michigan","Pennsylvania","North Carolina","Georgia","Florida","Texas"]), mascot:pick(mascots), stadium:pick(stadiums), primary:"#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0"), secondary:"#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0"), accent:"#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0"), strength:randomInt(1,5), rival:pick(schoolNames)+" High School" };
    document.getElementById("schoolName").value=school.name; document.getElementById("schoolCity").value=school.city; document.getElementById("schoolState").value=school.state; document.getElementById("schoolMascot").value=school.mascot; document.getElementById("stadiumName").value=school.stadium; document.getElementById("primaryColor").value=school.primary; document.getElementById("secondaryColor").value=school.secondary; document.getElementById("accentColor").value=school.accent; document.getElementById("schoolStrength").value=school.strength; document.getElementById("rivalSchool").value=school.rival;
    schoolRandomUses++;
    const remaining=Math.max(0,3-schoolRandomUses);
    const button=document.querySelector('.random-box .menu-button');
    button.textContent=remaining ? "🔄 REGENERATE SCHOOL" : "🎲 RANDOM GENERATION USED";
    button.disabled=remaining===0;
    button.style.opacity=remaining===0 ? ".5" : "1";
    document.getElementById("schoolRandomStatus").textContent = remaining+" regeneration"+(remaining===1?"":"s")+" remaining.";
}

function saveSchool() {
    const required=[["schoolName","School Name"],["schoolCity","City"],["schoolState","State"],["schoolMascot","Mascot"],["stadiumName","Stadium Name"]];
    const missing=required.filter(([id])=>!value(id)).map(([,label])=>label);
    if(missing.length){alert("Please complete: "+missing.join(", "));return;}
    careerData.school={name:value("schoolName"),city:value("schoolCity"),state:value("schoolState"),mascot:value("schoolMascot"),stadium:value("stadiumName"),primary:document.getElementById("primaryColor").value,secondary:document.getElementById("secondaryColor").value,accent:document.getElementById("accentColor").value,strength:Number(value("schoolStrength")),rival:value("rivalSchool")||"None"};
    renderCoachCreation();
}

function renderCoachCreation() {
    document.querySelector(".container").innerHTML = `
        <div class="page-title">CREATE YOUR COACH</div>
        <div class="subtitle">Your coach can shape your entire high-school career.</div>
        <div class="creation-panel">
            <div class="random-box"><button class="menu-button" onclick="randomCoach()">🎲 RANDOMLY GENERATE COACH</button><div id="coachRandomStatus" class="random-status">You get 3 regenerations after the initial random generation.</div></div>
            <h2>COACH INFORMATION</h2>
            <label>First Name</label><input id="coachFirst" placeholder="First Name">
            <label>Last Name</label><input id="coachLast" placeholder="Last Name">
            <label>Age</label><input id="coachAge" type="number" min="25" max="80" placeholder="45">
            <label>Offensive / Defensive Scheme</label><select id="coachScheme">${schemes.map(x=>`<option>${x}</option>`).join("")}</select>
            <label>Coaching Philosophy</label><select id="coachPhilosophy">${philosophies.map(x=>`<option>${x}</option>`).join("")}</select>
            <label>Player Development</label><select id="coachDevelopment"><option value="1">⭐</option><option value="2">⭐⭐</option><option value="3" selected>⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="5">⭐⭐⭐⭐⭐</option></select>
            <label>Strictness</label><select id="coachStrictness"><option value="1">Low</option><option value="2">Moderate</option><option value="3" selected>High</option><option value="4">Very High</option><option value="5">Extreme</option></select>
            <label>Personality</label><select id="coachPersonality">${personalities.map(x=>`<option>${x}</option>`).join("")}</select>
            <button class="menu-button" onclick="saveCoach()">START HIGH SCHOOL CAREER</button>
            <button class="back-button" onclick="renderSchoolCreation()">← BACK TO SCHOOL</button>
        </div>`;
}

function randomCoach() {
    document.getElementById("coachFirst").value=pick(coachFirstNames); document.getElementById("coachLast").value=pick(coachLastNames); document.getElementById("coachAge").value=randomInt(30,58); document.getElementById("coachScheme").value=pick(schemes); document.getElementById("coachPhilosophy").value=pick(philosophies); document.getElementById("coachDevelopment").value=randomInt(1,5); document.getElementById("coachStrictness").value=randomInt(1,5); document.getElementById("coachPersonality").value=pick(personalities);
    coachRandomUses++;
    const remaining=Math.max(0,3-coachRandomUses); const button=document.querySelector('.random-box .menu-button'); button.textContent=remaining ? "🔄 REGENERATE COACH" : "🎲 RANDOM GENERATION USED"; button.disabled=remaining===0; button.style.opacity=remaining===0 ? ".5" : "1"; document.getElementById("coachRandomStatus").textContent=remaining+" regeneration"+(remaining===1?"":"s")+" remaining.";
}

function saveCoach() {
    const required=[["coachFirst","First Name"],["coachLast","Last Name"],["coachAge","Age"]]; const missing=required.filter(([id])=>!value(id)).map(([,label])=>label); if(missing.length){alert("Please complete: "+missing.join(", "));return;}
    const age=Number(value("coachAge")); if(age<25||age>80){alert("Coach age must be between 25 and 80.");return;}
    careerData.coach={firstName:value("coachFirst"),lastName:value("coachLast"),age,scheme:value("coachScheme"),philosophy:value("coachPhilosophy"),development:Number(value("coachDevelopment")),strictness:Number(value("coachStrictness")),personality:value("coachPersonality")};
    careerData.highSchool={year:1,classYear:"Freshman",level:"JV",gamesPlayed:0,varsityGames:0,gpa:100,confidence:50,potentialPoints:0,achievements:[],awards:[],records:[],snapCounts:0,seasonStats:{}};
    localStorage.setItem("footballLegacyCareer",JSON.stringify(careerData));
    renderCareerHome();
}

function renderCareerHome() {
    const p=careerData.player,s=careerData.school,c=careerData.coach;
    document.querySelector(".container").innerHTML=`
        <div class="page-title">${p.firstName} ${p.lastName}</div>
        <div class="subtitle">${p.classYear} • ${p.position} • ${s.name}</div>
        <div class="creation-panel">
            <div class="rating-box"><div class="starting-overall">OVERALL <strong>60</strong></div><p>${p.archetype} • ${p.height} • ${p.weight} lbs • #${p.jersey}</p></div>
            <h2>YOUR PROGRAM</h2>
            <div class="stat-grid"><div class="stat-card"><span>SCHOOL</span>${s.name}</div><div class="stat-card"><span>MASCOT</span>${s.mascot}</div><div class="stat-card"><span>LEVEL</span>Freshman JV</div><div class="stat-card"><span>COACH</span>${c.firstName} ${c.lastName}</div></div>
            <h2>CAREER STATUS</h2>
            <div class="stat-grid"><div class="stat-card"><span>GAMES</span>0</div><div class="stat-card"><span>VARSITY GAMES</span>0</div><div class="stat-card"><span>GPA</span>100</div><div class="stat-card"><span>POTENTIAL POINTS</span>0</div></div>
            <button class="menu-button" onclick="alert('The high-school season engine is next. Your player, school, and coach are saved.')">CONTINUE</button>
            <button class="back-button" onclick="startCareer()">← RESTART CREATION</button>
        </div>`;
}

function loadCareer(){
    const saved=localStorage.getItem("footballLegacyCareer");
    if(!saved){alert("No saved career found yet.");return;}
    careerData=JSON.parse(saved); renderCareerHome();
}
function settings(){alert("Settings will include play-by-play highlight color and other career options.");}
</script>
</body>
</html>
