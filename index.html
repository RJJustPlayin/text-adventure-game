<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Legacy</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#202936,#080b10 70%);color:#fff;font-family:Arial,sans-serif}.container{max-width:980px;width:94%;margin:auto;padding:28px 0 50px}.logo,.page-title{text-align:center;font-weight:900}.logo{font-size:clamp(40px,8vw,72px);letter-spacing:3px}.page-title{font-size:clamp(30px,6vw,48px);margin-bottom:8px}.subtitle{text-align:center;color:#9da8b7;margin-bottom:22px}.menu{display:flex;flex-direction:column;gap:12px;max-width:760px;margin:auto}.menu-button,.back-button{width:100%;padding:14px;border-radius:8px;font-weight:800;cursor:pointer}.menu-button{background:#151c26;color:#fff;border:1px solid #354151}.menu-button:hover{background:#222d3b}.back-button{background:transparent;color:#aeb8c6;border:1px solid #394656}.panel,.creation-panel{background:#151c26;border:1px solid #354151;border-radius:12px;padding:20px;margin-bottom:14px}.creation-panel{max-height:82vh;overflow:auto}.panel h2,.creation-panel h2{font-size:16px;border-bottom:1px solid #303b49;padding-bottom:8px;margin:20px 0 12px}.creation-panel h2:first-child{margin-top:0}label{display:block;color:#aeb8c6;font-size:13px;margin:10px 0 5px}input,select{width:100%;padding:10px;background:#0e141c;color:#fff;border:1px solid #394656;border-radius:7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat-card,.activity-card,.skill-card,.notice,.result{background:#0e141c;border:1px solid #303b49;border-radius:9px;padding:12px}.stat-card span{display:block;color:#7f8b9b;font-size:11px}.stat-card b{font-size:21px}.activity-grid,.skill-grid,.attr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.activity-card h3{margin:0 0 5px}.activity-card p,.skill-card p{color:#9da8b7;font-size:13px}.scoreboard{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:10px}.big{font-size:30px;font-weight:900}.playlog{height:430px;overflow:auto;background:#080d13;border:1px solid #303b49;border-radius:8px;padding:10px}.play{padding:5px;border-bottom:1px solid #18212c;font-size:13px}.qhead{color:#9da8b7;font-weight:bold;margin:8px 0}.you{color:var(--highlight,#ff4040);font-weight:900}.success{color:#7ee787}.danger{color:#ff6b6b}.warning{color:#ffb347}.gold{color:#ffd866}.pill{display:inline-block;background:#202a36;padding:5px 9px;border-radius:999px;font-size:12px;margin:2px}.schedule-row{display:flex;justify-content:space-between;gap:10px;padding:10px;border-bottom:1px solid #2b3542}.schedule-row.current{border-left:4px solid #d9e2ec;background:#111923}.attr{background:#0e141c;border:1px solid #303b49;border-radius:9px;padding:10px}.attr b{font-size:20px}.attr-row{display:flex;justify-content:space-between;align-items:center}.plusminus{display:flex;gap:5px}.plusminus button{width:32px;height:30px;background:#182230;color:#fff;border:1px solid #475568;border-radius:5px}.footer{text-align:center;color:#687586;margin-top:30px}@media(max-width:680px){.grid{grid-template-columns:1fr 1fr}.activity-grid,.skill-grid,.attr-grid,.two,.scoreboard{grid-template-columns:1fr}}</style></head><body><div id="app" class="container"></div><script>

const pick=a=>a[Math.floor(Math.random()*a.length)],ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), $=id=>document.getElementById(id);let c=JSON.parse(localStorage.getItem('footballLegacyCareer')||'null')||{},schoolRolls=0,coachRolls=0;function save(){localStorage.setItem('footballLegacyCareer',JSON.stringify(c))}
function home(){c={};save();$('app').innerHTML='<div class="logo">🏈 FOOTBALL LEGACY</div><div class="subtitle">ONE PLAYER. ONE CAREER. ONE LEGACY.</div><div class="menu"><button class="menu-button" onclick="start()">START NEW CAREER</button><button class="menu-button" onclick="load()">LOAD CAREER</button><button class="menu-button" onclick="settings()">SETTINGS</button></div><div class="footer">HIGH SCHOOL → COLLEGE → NFL → RETIREMENT</div>'}
function start(){$('app').innerHTML='<div class="page-title">CREATE YOUR PLAYER</div><div class="subtitle">Your archetype is permanent.</div><div class="creation-panel"><h2>PLAYER</h2><label>First Name</label><input id="fn"><label>Last Name</label><input id="ln"><label>Birthday</label><input id="bd" type="date"><label>Hometown</label><input id="town"><label>State</label><input id="state"><label>Handedness</label><select id="hand"><option>Right</option><option>Left</option><option>Switch Passer</option></select><label>Height</label><input id="height" placeholder="5\'8"><label>Weight (1–500)</label><input id="weight" type="number" min="1" max="500"><label>Jersey Number (0–99)</label><input id="jersey" type="number" min="0" max="99"><label>Position</label><select id="pos" onchange="posChange()"><option value="">Select</option>${Object.keys(POS).map(x=>`<option>${x}</option>`).join('')}</select><label>Archetype</label><select id="arch"><option>Select position first</option></select><div class="notice"><b>STARTING OVR: 60</b><br>Everyone starts at exactly 60 OVR.</div><button class="menu-button" onclick="makePlayer()">CONTINUE TO 12 ATTRIBUTES</button><button class="back-button" onclick="home()">← BACK</button></div>'}
function posChange(){let p=$('pos').value;$('arch').innerHTML=POS[p]?POS[p].map(x=>`<option>${x}</option>`).join(''):'<option>Select position first</option>'}
function makePlayer(){let ids=['fn','ln','bd','town','state','height','weight','jersey','pos'];if(ids.some(x=>!$(x).value.trim())||!$('arch').value||$('arch').value.includes('Select'))return alert('Complete every player field.');let w=+$('weight').value,j=+$('jersey').value;if(w<1||w>500||j<0||j>99)return alert('Check weight and jersey number.');c.player={firstName:$('fn').value.trim(),lastName:$('ln').value.trim(),birthday:$('bd').value,hometown:$('town').value.trim(),state:$('state').value,handedness:$('hand').value,height:$('height').value.trim(),weight:w,jersey:j,position:$('pos').value,archetype:$('arch').value,overall:60};attrScreen()}
function attrScreen(){let a={};ATTR.forEach(x=>a[x]=50);(BOOST[c.player.archetype]||[]).forEach(x=>a[x]+=3);c.pending=a;c.spent=0;$('app').innerHTML='<div class="page-title">ALLOCATE YOUR 12 ATTRIBUTES</div><div class="subtitle">Archetype boosts are already applied. OVR stays 60.</div><div class="creation-panel"><div class="notice">POINTS LEFT: <b id="left">12</b></div><div class="attr-grid">'+ATTR.map(x=>`<div class="attr"><b>${x}</b><div class="attr-row"><strong id="a-${x.replaceAll(' ','-')}">${a[x]}</strong><div class="plusminus"><button onclick="changeAttr('${x}',-1)">−</button><button onclick="changeAttr('${x}',1)">+</button></div></div></div>`).join('')+'</div><button class="menu-button" onclick="confirmAttr()">CONFIRM 12 POINTS</button></div>'}
function changeAttr(n,d){let base=50+((BOOST[c.player.archetype]||[]).includes(n)?3:0);if(d>0&&c.spent>=12)return;if(d<0&&c.pending[n]<=base)return;c.pending[n]+=d;c.spent+=d;$('left').textContent=12-c.spent;$('a-'+n.replaceAll(' ','-')).textContent=c.pending[n]}
function confirmAttr(){if(c.spent!==12)return alert('Allocate all 12 points.');c.player.attributes={...c.pending};delete c.pending;delete c.spent;schoolScreen()}
function schoolScreen(){$('app').innerHTML='<div class="page-title">CREATE YOUR SCHOOL</div><div class="subtitle">Build it or generate it.</div><div class="creation-panel"><button id="sr" class="menu-button" onclick="randomSchool()">🎲 RANDOMLY GENERATE SCHOOL</button><div id="ss" class="notice">Initial generation + 3 regenerations.</div><label>Name</label><input id="sn"><label>City</label><input id="sc"><label>State</label><input id="sst"><label>Mascot</label><input id="sm"><label>Stadium</label><input id="stad"><label>School Strength</label><select id="strength"><option value="1">⭐ Rebuilding</option><option value="2">⭐⭐ Developing</option><option value="3" selected>⭐⭐⭐ Competitive</option><option value="4">⭐⭐⭐⭐ State Contender</option><option value="5">⭐⭐⭐⭐⭐ National Powerhouse</option></select><label>Rival</label><input id="rival"><button class="menu-button" onclick="saveSchool()">CONTINUE TO COACH</button><button class="back-button" onclick="attrScreen()">← BACK</button></div>'}
function randomSchool(){let names=['Lincoln','Central','Jefferson','Roosevelt','Washington','Franklin','Westview','East Ridge','North Valley','Southside'],mas=['Tigers','Eagles','Panthers','Bulldogs','Wolves','Falcons','Knights','Lions','Hawks','Raiders'];if(schoolRolls>=4)return;[$('sn').value,$('sc').value,$('sst').value,$('sm').value,$('stad').value,$('strength').value,$('rival').value]=[pick(names)+' High School',pick(['Buffalo','Rochester','Syracuse','Albany']),pick(['New York','Ohio','Michigan','Pennsylvania']),pick(mas),pick(['Memorial Stadium','Legacy Field','Victory Stadium']),ri(1,5),pick(names)+' High School'];schoolRolls++;$('sr').textContent=schoolRolls<4?'🔄 REGENERATE SCHOOL':'GENERATIONS USED';$('sr').disabled=schoolRolls>=4;$('ss').textContent=(4-schoolRolls)+' regeneration'+(4-schoolRolls===1?'':'s')+' remaining.'}
function saveSchool(){if(['sn','sc','sst','sm','stad'].some(x=>!$(x).value.trim()))return alert('Complete school information.');c.school={name:$('sn').value.trim(),city:$('sc').value.trim(),state:$('sst').value,mascot:$('sm').value.trim(),stadium:$('stad').value.trim(),strength:+$('strength').value,rival:$('rival').value.trim()||'Central High School',classification:pick(['AAA','AA','A','B','C','D'])};coachScreen()}
function coachScreen(){$('app').innerHTML='<div class="page-title">CREATE YOUR COACH</div><div class="subtitle">Your coach shapes scheme, trust and development.</div><div class="creation-panel"><button id="cr" class="menu-button" onclick="randomCoach()">🎲 RANDOMLY GENERATE COACH</button><div id="cs" class="notice">Initial generation + 3 regenerations.</div><label>First Name</label><input id="cf"><label>Last Name</label><input id="cl"><label>Age</label><input id="ca" type="number" min="25" max="80"><label>Scheme</label><select id="scheme"><option>Balanced</option><option>Spread</option><option>Pro Style</option><option>Air Raid</option><option>Power Run</option><option>West Coast</option></select><label>Philosophy</label><select id="phil"><option>Player Development</option><option>Win Now</option><option>Discipline</option><option>Player Friendly</option><option>Tough Love</option><option>Analytics</option></select><label>Player Development</label><select id="dev"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select><label>Personality</label><select id="person"><option>Players' Coach</option><option>Demanding</option><option>Motivator</option><option>Old School</option><option>Innovator</option></select><button class="menu-button" onclick="saveCoach()">CONTINUE TO CAREER</button><button class="back-button" onclick="schoolScreen()">← BACK</button></div>'}
function randomCoach(){if(coachRolls>=4)return;let f=pick(['James','Marcus','Derrick','Anthony','Michael','Robert','Daniel','Andre','Chris','Kevin']),l=pick(['Carter','Williams','Johnson','Davis','Thompson','Mitchell','Robinson','Bennett','Jackson','Miller']);$('cf').value=f;$('cl').value=l;$('ca').value=ri(30,58);$('scheme').value=pick(['Balanced','Spread','Pro Style','Air Raid','Power Run','West Coast']);$('phil').value=pick(['Player Development','Win Now','Discipline','Player Friendly','Tough Love','Analytics']);$('dev').value=ri(1,5);$('person').value=pick(["Players' Coach",'Demanding','Motivator','Old School','Innovator']);coachRolls++;$('cr').textContent=coachRolls<4?'🔄 REGENERATE COACH':'GENERATIONS USED';$('cr').disabled=coachRolls>=4;$('cs').textContent=(4-coachRolls)+' regeneration'+(4-coachRolls===1?'':'s')+' remaining.'}
function saveCoach(){if(!$('cf').value.trim()||!$('cl').value.trim()||!$('ca').value)return alert('Complete coach information.');c.coach={firstName:$('cf').value.trim(),lastName:$('cl').value.trim(),age:+$('ca').value,scheme:$('scheme').value,philosophy:$('phil').value,development:+$('dev').value,personality:$('person').value};c.hs={classYear:'Freshman',year:1,week:0,level:'JV',energy:6,energyCap:6,wear:0,confidence:50,coachTrust:50,chemistry:65,varsityGames:0,teamWins:0,teamLosses:0,seasonStats:initStats(),schedule:makeSchedule(),potentialPoints:0,skills:skillList().slice(0,5),skillProgress:{},highlightColor:'#ff4040',awards:[],events:[],seasonDone:false,playoff:false};c.hs.skills.forEach(s=>c.hs.skillProgress[s]=0);save();intro()}
function intro(){$('app').innerHTML=`<div class="page-title">WELCOME TO FRESHMAN YEAR</div><div class="subtitle">Your first chapter begins now.</div><div class="panel"><h2>YOUR STORY</h2><p>You are a freshman. Everyone starts at <b>60 OVR</b>. Your archetype is permanent and your body is permanent.</p><div class="notice"><b>${esc(c.player.firstName)} ${esc(c.player.lastName)}</b> • ${c.player.position} • ${c.player.archetype}<br>${esc(c.school.name)} • Class ${c.school.classification}</div></div><button class="menu-button" onclick="hub()">ENTER FRESHMAN CAREER HUB</button>`}
function hub(){let h=c.hs,g=h.schedule[h.week];$('app').innerHTML=`<div class="page-title">FRESHMAN CAREER HUB</div><div class="subtitle">Week ${Math.min(h.week+1,9)} • ${h.level} • ${esc(c.school.name)}</div><div class="grid"><div class="stat-card"><span>OVR</span><b>${ovr()}</b></div><div class="stat-card"><span>ENERGY</span><b>${h.energy}/${h.energyCap}</b></div><div class="stat-card"><span>WEAR & TEAR</span><b>${h.wear}%</b></div><div class="stat-card"><span>CONFIDENCE</span><b>${Math.round(h.confidence)}</b></div><div class="stat-card"><span>COACH TRUST</span><b>${Math.round(h.coachTrust)}</b></div><div class="stat-card"><span>CHEMISTRY</span><b>${Math.round(h.chemistry)}</b></div></div><div class="panel"><h2>NEXT GAME</h2><div class="scoreboard"><div><span>YOU</span><div class="big">${h.level}</div></div><div><span>WEEK ${h.week+1}</span><div class="big">VS</div></div><div><span>${esc(g?.name||'Season Complete')}</span><div class="big">${g?.home?'HOME':'AWAY'}</div></div></div><div class="notice">Home-field modifier is chemistry-based: <b>-2% to +3.5%</b>.</div></div><div class="two"><button class="menu-button" onclick="training()">WEEKLY AGENDA</button><button class="menu-button" onclick="player()">PLAYER</button><button class="menu-button" onclick="skills()">SKILLS</button><button class="menu-button" onclick="potential()">POTENTIAL</button></div><button class="menu-button" onclick="playNext()">PLAY WEEK ${h.week+1}</button><button class="menu-button" onclick="simulate()">⏩ SIMULATE WEEK ${h.week+1}</button><button class="back-button" onclick="review()">VIEW SEASON REVIEW</button>`}
function weeklyCap(){return c.hs.week%5===0?7:c.hs.week%4===0?5:6}
function training(){let h=c.hs;h.energyCap=weeklyCap();if(h.energy>h.energyCap)h.energy=h.energyCap;$('app').innerHTML=`<div class="page-title">WEEKLY AGENDA</div><div class="subtitle">Road-to-Glory-inspired time management, rebuilt for Football Legacy.</div><div class="grid"><div class="stat-card"><span>ENERGY</span><b>${h.energy}/${h.energyCap}</b></div><div class="stat-card"><span>WEAR & TEAR</span><b>${h.wear}%</b></div><div class="stat-card"><span>CONFIDENCE</span><b>${Math.round(h.confidence)}</b></div><div class="stat-card"><span>COACH TRUST</span><b>${Math.round(h.coachTrust)}</b></div></div><div class="activity-grid"><div class="activity-card"><h3>🎥 Film</h3><p>Study yourself, your position or the opponent.</p><button class="menu-button" onclick="act('film')">SPEND 1</button></div><div class="activity-card"><h3>🏈 Field</h3><p>Position work. Small chance of attribute growth.</p><button class="menu-button" onclick="act('field')">SPEND 1</button></div><div class="activity-card"><h3>🏋️ Weight Room</h3><p>Development with a small wear cost.</p><button class="menu-button" onclick="act('weight')">SPEND 1</button></div><div class="activity-card"><h3>🩹 Recovery</h3><p><b>Does not restore Energy.</b> It only reduces Wear & Tear.</p><button class="menu-button" onclick="act('recovery')">SPEND 1</button></div><div class="activity-card"><h3>🤝 Team</h3><p>Build chemistry and confidence.</p><button class="menu-button" onclick="act('team')">SPEND 1</button></div><div class="activity-card"><h3>🧠 Rest</h3><p>Protect your body. Minimal development.</p><button class="menu-button" onclick="act('rest')">SPEND 1</button></div></div><div class="notice">Energy is a weekly time budget. Unused Energy does not carry over. Recovery uses Energy but never gives Energy back.</div><button class="back-button" onclick="hub()">← BACK</button>`}
function act(type){let h=c.hs;if(h.energy<1)return alert('No Energy left this week.');h.energy--;if(type==='film'){h.coachTrust=Math.min(100,h.coachTrust+ri(1,3));h.confidence=Math.min(100,h.confidence+1)}if(type==='field'){h.wear=Math.min(100,h.wear+ri(2,4));if(Math.random()<.45){let k=pick(ATTR);c.player.attributes[k]=Math.min(99,c.player.attributes[k]+1)}}if(type==='weight'){h.wear=Math.min(100,h.wear+ri(3,5));if(Math.random()<.4){let k=pick(['Strength','Power','Stamina','Toughness']);c.player.attributes[k]=Math.min(99,c.player.attributes[k]+1)}}if(type==='recovery')h.wear=Math.max(0,h.wear-ri(12,20));if(type==='team')h.chemistry=Math.min(100,h.chemistry+ri(1,3));if(type==='rest'){h.wear=Math.max(0,h.wear-5);h.confidence=Math.min(100,h.confidence+1)}save();training()}
function skillList(){let p=c.player.position,r=p==='OT'||p==='OG'||p==='C'?'OL':p==='EDGE'||p==='DT'?'DL':p.includes('LB')?'LB':p==='CB'||p==='FS'||p==='SS'?'DB':p;return SKILLS[r]||['Clutch','Consistency','Football IQ','Toughness','Discipline','Recovery','Two-Way Player','Film Mastery','Big Moment','Pressure Proof','Leader','Durable']}
function tier(v){return v>=100?'Diamond':v>=65?'Gold':v>=35?'Silver':v>=10?'Bronze':'Locked'}function skills(){let h=c.hs,list=skillList();$('app').innerHTML=`<div class="page-title">SKILL TREE</div><div class="subtitle">Pick up to 5. Unlocks are cheap; leveling is slower.</div><div class="skill-grid">${list.map(s=>{let on=h.skills.includes(s),t=on?tier(h.skillProgress[s]||0):'Locked';return `<div class="skill-card"><h3>${esc(s)}</h3><b>${t}</b><p>Small specialized boost when equipped.</p>${on?'<button class="menu-button" disabled>EQUIPPED</button>':`<button class="menu-button" onclick='unlockSkill(${JSON.stringify(s)})'>UNLOCK • 1 ENERGY</button>`}</div>`}).join('')}</div><div class="notice">At the end of each season you can replace your five equipped skills. Unlocked skills stay unlocked.</div><button class="back-button" onclick="hub()">← BACK</button>`}

function potential(){let h=c.hs;$('app').innerHTML=`<div class="page-title">POTENTIAL TREE</div><div class="subtitle">Quests grant Potential Points. Access ends after freshman college.</div><div class="panel"><div class="stat-card"><span>POTENTIAL POINTS</span><b>${h.potentialPoints}</b></div><div class="skill-grid">${[['Training Capacity','Increase weekly Energy cap by 1, up to 200.'],['Fast Learner','Small development bonus.'],['Film Mastery','Film becomes more effective.'],['Two-Way Player','Unlock two-way progression.'],['Recovery Specialist','Recovery removes more Wear & Tear.'],['High Motor','Small consistency boost.']].map(x=>`<div class="skill-card"><h3>${x[0]}</h3><p>${x[1]}</p><button class="menu-button" ${h.potentialPoints<1?'disabled':''} onclick='unlockPotential(${JSON.stringify(x[0])})'>UNLOCK • 1 POINT</button></div>`).join('')}</div></div><button class="back-button" onclick="hub()">← BACK</button>`}
function unlockPotential(n){let h=c.hs;if(h.potentialPoints<1)return;h.potentialPoints--;if(n==='Training Capacity')h.energyCap=Math.min(200,h.energyCap+1);save();potential()}
function player(){let p=c.player,h=c.hs;$('app').innerHTML=`<div class="page-title">PLAYER</div><div class="subtitle">${esc(p.firstName)} ${esc(p.lastName)}</div><div class="panel"><div class="grid"><div class="stat-card"><span>OVR</span><b>${ovr()}</b></div><div class="stat-card"><span>CONFIDENCE</span><b>${Math.round(h.confidence)}</b></div><div class="stat-card"><span>ENERGY</span><b>${h.energy}/${h.energyCap}</b></div><div class="stat-card"><span>WEAR & TEAR</span><b>${h.wear}%</b></div><div class="stat-card"><span>COACH TRUST</span><b>${Math.round(h.coachTrust)}</b></div><div class="stat-card"><span>CHEMISTRY</span><b>${Math.round(h.chemistry)}</b></div></div><h2>BIO</h2><p>${esc(p.hometown)}, ${esc(p.state)} • ${esc(p.height)} • ${p.weight} lbs • #${p.jersey}</p><p>${p.position} • <b>${esc(p.archetype)}</b> • ${h.classYear}</p><h2>ATTRIBUTES</h2><div class="grid">${ATTR.map(a=>`<div class="stat-card"><span>${a}</span><b>${p.attributes[a]}</b></div>`).join('')}</div><h2>SEASON STATS</h2>${statsTable(h.seasonStats)}</div><button class="back-button" onclick="hub()">← BACK</button>`}
function initStats(){return {games:0,snaps:0,rushAtt:0,rushYds:0,rushTD:0,rec:0,targets:0,recYds:0,recTD:0,drops:0,fumbles:0,passCmp:0,passAtt:0,passYds:0,passTD:0,ints:0,tackles:0,tfl:0,sacks:0,qbHits:0,pbu:0,intsDef:0,ff:0,pancakes:0,sacksAllowed:0,pressuresAllowed:0,runWins:0,passWins:0,penalties:0,krYds:0,prYds:0,stTkl:0}}
function statsTable(s){return `<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th>G</th><th>Snaps</th><th>Rush</th><th>Rush Yds</th><th>Rush TD</th><th>Rec</th><th>Rec Yds</th><th>Rec TD</th><th>Tkl</th><th>Sacks</th><th>PBU</th><th>Pancakes</th></tr><tr><td>${s.games}</td><td>${s.snaps}</td><td>${s.rushAtt}</td><td>${s.rushYds}</td><td>${s.rushTD}</td><td>${s.rec}</td><td>${s.recYds}</td><td>${s.recTD}</td><td>${s.tackles}</td><td>${s.sacks}</td><td>${s.pbu}</td><td>${s.pancakes}</td></tr></table></div>`}
function role(){let p=c.player.position;return p==='FB'?'RB':p==='OT'||p==='OG'||p==='C'?'OL':p==='EDGE'||p==='DT'?'DL':p.includes('LB')?'LB':p==='CB'||p==='FS'||p==='SS'?'DB':p}
function ovr(){let a=c.player.attributes,keys={QB:['Awareness','Football IQ','Technique','Discipline','Power','Speed'],RB:['Speed','Acceleration','Agility','Power','Awareness','Football IQ'],WR:['Speed','Acceleration','Agility','Technique','Awareness'],TE:['Strength','Power','Technique','Awareness','Speed','Toughness'],OL:['Strength','Power','Technique','Awareness','Toughness'],DL:['Speed','Acceleration','Power','Strength','Technique','Toughness'],LB:['Awareness','Toughness','Strength','Speed','Football IQ','Technique'],DB:['Speed','Agility','Technique','Awareness','Football IQ'],K:['Power','Technique','Discipline','Football IQ'],P:['Power','Technique','Discipline','Awareness']}[role()]||ATTR,avg=keys.reduce((n,k)=>n+(a[k]||50),0)/keys.length;return Math.max(60,Math.min(99,Math.round(60+(avg-50)*.8)))}
function makeSchedule(){let a=[];for(let i=0;i<9;i++)a.push({name:i===3?c.school.rival:pick(['Lincoln High School','Central High School','Jefferson High School','Roosevelt High School','Westview High School']),home:i%2===0,rival:i===3,result:null});return a}
function generic(){return pick(['run for 3 yards.','pass complete for 7 yards.','incomplete pass.','run stopped for 2 yards.','pass complete for 11 yards.','penalty, 5 yards.','punt.','defensive stop.'])}
function playerPlay(s){let n=esc(c.player.lastName),a=c.player.attributes,x=Math.random(),r=role();if(r==='RB'){if(x<.6){let y=ri(1,14)+(a.Speed>65?ri(0,5):0);s.rushAtt++;s.rushYds+=y;if(x<.06){s.rushTD++;return `<span class="you">${n} rushes for ${y} yards — TOUCHDOWN!</span>`}return `<span class="you">${n} takes the handoff for ${y} yards.</span>`}let y=ri(2,12);s.targets++;s.rec++;s.recYds+=y;return `<span class="you">Pass complete to ${n} for ${y} yards.</span>`}if(r==='WR'||r==='TE'){s.targets++;if(x<.22){s.rec++;let y=ri(5,22);s.recYds+=y;if(x<.04){s.recTD++;return `<span class="you">${n} makes the catch for a TOUCHDOWN!</span>`}return `<span class="you">${n} catches a pass for ${y} yards.</span>`}if(x<.27){s.drops++;return `<span class="you">Pass intended for ${n} — DROP.</span>`}return `<span class="you">${n} runs a route and creates separation.</span>`}if(r==='QB'){s.passAtt++;if(x<.62){s.passCmp++;let y=ri(4,22);s.passYds+=y;if(x<.08){s.passTD++;return `<span class="you">${n} throws a TOUCHDOWN pass for ${y} yards.</span>`}return `<span class="you">${n} completes a ${y}-yard pass.</span>`}if(x<.05)s.ints++;return `<span class="you">${n} throws an incomplete pass${x<.05?' — INTERCEPTED!':''}.</span>`}if(r==='OL'){let win=Math.random()<.72;s.runWins+=win?1:0;s.passWins+=win?1:0;if(win){s.pancakes++;return `<span class="you">${n} wins the block and opens the lane.</span>`}s.pressuresAllowed++;return `<span class="you">${n} gives up pressure.</span>`}if(r==='DL'){s.tackles++;if(x<.18)s.tfl++;if(x<.07)s.sacks++;return `<span class="you">${n} makes a defensive play${x<.07?' — SACK!':''}.</span>`}if(r==='LB'){s.tackles++;if(x<.18)s.tfl++;return `<span class="you">${n} makes a tackle${x<.18?' for loss':''}.</span>`}if(r==='DB'){if(x<.15){s.pbu++;return `<span class="you">${n} breaks up the pass.</span>`}s.tackles++;return `<span class="you">${n} makes a defensive tackle.</span>`}return `<span class="you">${n} contributes on special teams.</span>`}
function applyStats(s,r){if(r==='RB'&&!s.rushAtt){s.rushAtt=ri(5,12);s.rushYds=s.rushAtt*ri(3,7);if(Math.random()<.2)s.rushTD=1}if(r==='WR'&&!s.targets){s.targets=ri(2,8);s.rec=Math.floor(s.targets*.65);s.recYds=s.rec*ri(7,13)}if(r==='TE'&&!s.targets){s.targets=ri(1,6);s.rec=Math.floor(s.targets*.65);s.recYds=s.rec*ri(6,12)}if(r==='OL'){s.pancakes+=ri(1,6);s.runWins+=ri(5,12);s.passWins+=ri(5,12)}if(r==='LB'||r==='DB')s.tackles+=ri(2,7);if(r==='DL'){s.tackles+=ri(1,5);if(Math.random()<.25)s.sacks++}}
function merge(a,b){Object.keys(b).forEach(k=>{if(typeof b[k]==='number')a[k]=(a[k]||0)+b[k]});return a}function perf(s,r){let x=55;if(r==='RB')x+=s.rushYds/10+s.rushTD*10+s.recYds/20-s.fumbles*8;if(r==='WR'||r==='TE')x+=s.recYds/12+s.recTD*10-s.drops*7;if(r==='OL')x+=s.pancakes*2+s.runWins+s.passWins-s.pressuresAllowed*2;if(r==='DL')x+=s.tackles+s.tfl*3+s.sacks*5;if(r==='LB'||r==='DB')x+=s.tackles+s.tfl*3+s.sacks*5+s.pbu*2;return Math.max(0,Math.min(100,Math.round(x)))}
function playNext(){playGame(false)}function simulate(){if(!confirm('Simulating can change performance, Coach Trust, depth-chart status, injuries and Wear & Tear. Continue?'))return;playGame(true)}
function playGame(sim){let h=c.hs,g=h.schedule[h.week],s=initStats(),team=0,opp=0,logs=[],r=role();for(let q=1;q<=4;q++){let tq=ri(0,14),oq=ri(0,14);team+=tq;opp+=oq;logs.push(`<div class="qhead">${q}Q — ${team}-${opp}</div>`);for(let i=0;i<ri(10,16);i++){let involved=Math.random()<((h.level==='Varsity'?.24:.10)+(h.coachTrust/1000));logs.push(`<div class="play">${involved?playerPlay(s):generic()}</div>`)}}if(team===opp)team++;let won=team>opp;g.result=`${won?'W':'L'} ${team}-${opp}`;h.week++;h.teamWins+=won?1:0;h.teamLosses+=won?0:1;s.games=1;s.snaps=ri(18,65);if(h.level==='Varsity')h.varsityGames++;applyStats(s,r);h.seasonStats=merge(h.seasonStats,s);let ps=perf(s,r);h.wear=Math.min(100,h.wear+ri(4,10)+Math.floor(s.snaps/15));h.confidence=Math.max(0,Math.min(100,h.confidence+(won?ri(2,6):-ri(1,5))));h.coachTrust=Math.max(0,Math.min(100,h.coachTrust+(ps>65?ri(2,6):-ri(0,3))));h.chemistry=Math.max(0,Math.min(100,h.chemistry+(won?1:-1)+(ps>70?1:0)));if(h.level==='JV'&&ps>72&&h.coachTrust>65&&Math.random()<.45){h.level='Varsity';h.coachTrust=Math.min(100,h.coachTrust+8)}save();postGame(team,opp,won,logs,s)}
function postGame(team,opp,won,logs,s){let h=c.hs;$('app').innerHTML=`<div class="page-title">${won?'🏆 VICTORY':'FINAL SCORE'}</div><div class="subtitle">${h.week>=9?'FINAL REGULAR SEASON':'WEEK '+h.week}</div><div class="panel"><div class="scoreboard"><div><span>${esc(c.school.name)}</span><div class="big">${team}</div></div><div><span>FINAL</span><div class="big">${won?'W':'L'}</div></div><div><span>${esc(h.schedule[h.week-1].name)}</span><div class="big">${opp}</div></div></div><h2>PLAY-BY-PLAY</h2><div class="playlog">${logs.join('')}</div></div><div class="panel"><h2>YOUR STATS</h2>${statsTable(s)}<div class="notice">Performance: ${perf(s,role())}/100 • Coach Trust: ${Math.round(h.coachTrust)} • Confidence: ${Math.round(h.confidence)} • Wear & Tear: ${h.wear}%</div><h2>TEAM / OPPONENT</h2><div class="two"><div class="stat-card"><span>TEAM</span><b>${team} points • ${h.teamWins}-${h.teamLosses}</b></div><div class="stat-card"><span>OPPONENT</span><b>${opp} points</b></div></div></div><button class="menu-button" onclick="afterGame()">CONTINUE</button>`}
function afterGame(){if(c.hs.week>=9)return postseason();randomEvent();c.hs.energy=weeklyCap();c.hs.energyCap=weeklyCap();save();hub()}
function randomEvent(){let h=c.hs,e=pick(['A teammate compliments your work ethic. Chemistry +2.','Your coach gives you extra film advice. Coach Trust +2.','A local reporter mentions your performance. Confidence +2.','A teammate asks you to stay late and work. Chemistry +1.','A trainer recommends recovery. Wear & Tear -5.']);if(e.includes('Chemistry +2'))h.chemistry=Math.min(100,h.chemistry+2);if(e.includes('Chemistry +1'))h.chemistry=Math.min(100,h.chemistry+1);if(e.includes('Trust +2'))h.coachTrust=Math.min(100,h.coachTrust+2);if(e.includes('Confidence +2'))h.confidence=Math.min(100,h.confidence+2);if(e.includes('Wear & Tear'))h.wear=Math.max(0,h.wear-5);h.events.push(e);if(Math.random()<.15){h.potentialPoints++;h.awards.push('Potential Quest Completed')}}
function postseason(){let h=c.hs;if(h.varsityGames<5)return endCareer(`You finished high school without enough varsity film. Varsity film: ${h.varsityGames}/5.`);if(h.teamWins<5)return review();h.playoff=true;let wins=0,rounds=[];for(let i=0;i<4;i++){let w=Math.random()<(.48+h.teamWins*.03);rounds.push(w);if(w)wins++;else break}$('app').innerHTML=`<div class="page-title">🏆 STATE PLAYOFFS</div><div class="subtitle">Class ${c.school.classification}</div><div class="panel">${rounds.map((w,i)=>`<div class="schedule-row"><b>${['Regional','Quarterfinal','Semifinal','State Championship'][i]}</b><span class="${w?'success':'danger'}">${w?'WIN':'LOSS'}</span></div>`).join('')}<div class="notice">${wins===4?'<span class="gold"><b>STATE CHAMPIONS!</b></span>':'Your playoff run has ended.'}</div></div><button class="menu-button" onclick="review()">FRESHMAN SEASON REVIEW</button>`}
function review(){let h=c.hs;h.seasonDone=true;save();$('app').innerHTML=`<div class="page-title">🏆 FRESHMAN SEASON REVIEW</div><div class="subtitle">The first chapter is complete.</div><div class="panel"><div class="grid"><div class="stat-card"><span>FINAL RECORD</span><b>${h.teamWins}-${h.teamLosses}</b></div><div class="stat-card"><span>VARSITY GAMES</span><b>${h.varsityGames}/5</b></div><div class="stat-card"><span>FINAL OVR</span><b>${ovr()}</b></div><div class="stat-card"><span>WEAR</span><b>${h.wear}%</b></div><div class="stat-card"><span>COACH TRUST</span><b>${Math.round(h.coachTrust)}</b></div><div class="stat-card"><span>POTENTIAL</span><b>${h.potentialPoints}</b></div></div><h2>SEASON STATS</h2>${statsTable(h.seasonStats)}<h2>SKILLS</h2>${h.skills.map(s=>`<span class="pill">${esc(s)} • ${tier(h.skillProgress[s]||0)}</span>`).join('')}<h2>AWARDS</h2><div class="notice">${h.awards.length?h.awards.map(x=>`🏅 ${esc(x)}`).join('<br>'):'No major awards yet.'}</div></div><button class="menu-button" onclick="offseason()">ENTER SOPHOMORE OFFSEASON</button>`}
function offseason(){let h=c.hs;h.classYear='Sophomore';h.year=2;h.week=0;h.energy=6;h.energyCap=6;h.wear=0;h.seasonStats=initStats();h.schedule=makeSchedule();h.teamWins=0;h.teamLosses=0;h.varsityGames=0;h.seasonDone=false;h.level='Varsity';save();hub()}
function endCareer(reason){$('app').innerHTML=`<div class="page-title">CAREER ENDED</div><div class="panel"><h2 class="danger">${esc(reason)}</h2></div><button class="menu-button" onclick="home()">START OVER</button>`}
function load(){if(!c.player||!c.hs)return alert('No saved career found.');document.documentElement.style.setProperty('--highlight',c.hs.highlightColor||'#ff4040');hub()}function settings(){let x=prompt('Play-by-play highlight color (hex):',c.hs?.highlightColor||'#ff4040');if(x&&/^#[0-9a-fA-F]{6}$/.test(x)){if(c.hs)c.hs.highlightColor=x;document.documentElement.style.setProperty('--highlight',x);save()}}
if(c.player&&c.hs){document.documentElement.style.setProperty('--highlight',c.hs.highlightColor||'#ff4040');hub()}else home();
</script></body></html>
