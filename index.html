<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Legacy</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at center, #202936 0%, #080b10 70%);

    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 90%;
    max-width: 700px;
    text-align: center;
}

.logo {
    font-size: clamp(42px, 8vw, 75px);
    font-weight: 900;
    letter-spacing: 3px;

    margin-bottom: 5px;
}

.subtitle {
    color: #9da8b7;
    font-size: 18px;
    letter-spacing: 2px;

    margin-bottom: 45px;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.menu-button {
    width: 100%;

    padding: 18px;

    background: #151c26;

    color: white;

    border: 1px solid #354151;

    border-radius: 8px;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    transition:
        transform 0.15s,
        background 0.15s,
        border-color 0.15s;
}

.menu-button:hover {
    background: #222d3b;
    border-color: #66778c;

    transform: translateY(-2px);
}

.menu-button:active {
    transform: translateY(0);
}

.footer {
    margin-top: 50px;

    color: #687586;

    font-size: 13px;
    letter-spacing: 1px;
}

.version {
    margin-top: 12px;

    color: #465160;

    font-size: 12px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        🏈 FOOTBALL LEGACY
    </div>

    <div class="subtitle">
        ONE PLAYER. ONE CAREER. ONE LEGACY.
    </div>

    <div class="menu">

        <button
            class="menu-button"
            onclick="startCareer()">
            START NEW CAREER
        </button>

        <button
            class="menu-button"
            onclick="loadCareer()">
            LOAD CAREER
        </button>

        <button
            class="menu-button"
            onclick="settings()">
            SETTINGS
        </button>

    </div>

    <div class="footer">

        HIGH SCHOOL → COLLEGE → NFL → RETIREMENT

        <div class="version">
            Football Legacy • Career Simulator
        </div>

    </div>

</div>


<script>

function startCareer() {

    document.querySelector(".container").innerHTML = `

        <div class="page-title">
            CREATE YOUR PLAYER
        </div>

        <div class="subtitle">
            Your career begins here.
        </div>

        <div class="creation-panel">

            <h2>PLAYER INFORMATION</h2>

            <label>First Name</label>
            <input id="firstName" type="text" placeholder="First Name">

            <label>Last Name</label>
            <input id="lastName" type="text" placeholder="Last Name">

            <label>Birthday</label>
            <input id="birthday" type="date">

            <label>Hometown</label>
            <input id="hometown" type="text" placeholder="Hometown">

            <label>State</label>

            <select id="state">

                <option value="">Select State</option>

                <option>New York</option>
                <option>California</option>
                <option>Texas</option>
                <option>Florida</option>
                <option>Georgia</option>
                <option>Ohio</option>
                <option>Pennsylvania</option>
                <option>Michigan</option>
                <option>New Jersey</option>
                <option>North Carolina</option>

            </select>


            <label>Handedness</label>

            <select id="handedness">

                <option value="Right">Right</option>
                <option value="Left">Left</option>

            </select>


            <h2>PHYSICAL BUILD</h2>

            <label>Height</label>

            <input
                id="height"
                type="text"
                placeholder="Example: 5'8"
            >


            <label>Weight</label>

            <input
                id="weight"
                type="number"
                placeholder="Weight in lbs"
            >


            <label>Jersey Number</label>

            <input
                id="jersey"
                type="number"
                min="0"
                max="99"
                placeholder="1"
            >


            <h2>POSITION</h2>

            <select
                id="position"
                onchange="updatePosition()"
            >

                <option value="">Select Position</option>

                <option>QB</option>
                <option>RB</option>
                <option>FB</option>
                <option>WR</option>
                <option>TE</option>

                <option>OT</option>
                <option>OG</option>
                <option>C</option>

                <option>EDGE</option>
                <option>DT</option>

                <option>Mike LB</option>
                <option>Sam LB</option>
                <option>Will LB</option>

                <option>CB</option>
                <option>FS</option>
                <option>SS</option>

                <option>K</option>
                <option>P</option>

                <option value="RANDOM">
                    🎲 Random Position
                </option>

            </select>


            <div id="archetypeBox">

                <label>Archetype</label>

                <select id="archetype">

                    <option>
                        Select a position first
                    </option>

                </select>

            </div>


            <h2>STARTING RATINGS</h2>

            <div class="rating-box">

                <div class="starting-overall">
                    OVERALL
                    <strong>60</strong>
                </div>

                <p>
                    You have
                    <strong>12</strong>
                    attribute points to allocate.
                </p>

                <p class="small-text">
                    Your archetype will provide a small
                    starting boost.
                </p>

            </div>


            <button
                class="menu-button"
                onclick="createPlayer()"
            >
                CREATE PLAYER
            </button>


            <button
                class="back-button"
                onclick="location.reload()"
            >
                ← BACK
            </button>

        </div>

    `;

}

}

function loadCareer() {

    alert("Load Career — Coming Next");

}

function settings() {

    alert("Settings — Coming Next");

}

</script>

</body>
</html>
