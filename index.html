<script>

ower","Toughness"],"Coverage Linebacker":["Speed","Agility","Awareness"],"Blitzer":["Acceleration","Speed","Technique"],"Balanced Sam":["Awareness","Speed","Technique"],"Coverage Specialist":["Speed","Agility","Awareness"],"Speed Linebacker":["Speed","Acceleration","Agility"],"Balanced Will":["Awareness","Technique","Speed"],"Man Coverage":["Speed","Agility","Technique"],"Zone Corner":["Awareness","Football IQ","Speed"],"Press Corner":["Strength","Technique","Toughness"],"Ball Hawk":["Awareness","Jumping","Speed"],"Center Fielder":["Speed","Awareness","Jumping"],"Zone Safety":["Awareness","Football IQ","Speed"],"Balanced Free Safety":["Awareness","Technique","Speed"],"Box Safety":["Strength","Toughness","Power"],"Enforcer":["Toughness","Strength","Power"],"Man Safety":["Speed","Agility","Technique"],"Balanced Strong Safety":["Awareness","Toughness","Technique"],"Power Kicker":["Power","Strength","Technique"],"Accuracy Kicker":["Technique","Discipline","Football IQ"],"Clutch Kicker":["Discipline","Technique","Toughness"],"Power Punter":["Power","Technique","Strength"],"Precision Punter":["Technique","Discipline","Football IQ"],"Directional Punter":["Technique","Awareness","Football IQ"]};
const schoolNames=["Lincoln","Central","Jefferson","Roosevelt","Washington","Franklin","Westview","East Ridge","North Valley","Southside"],mascots=["Tigers","Eagles","Panthers","Bulldogs","Wolves","Falcons","Knights","Lions","Hawks","Raiders"],cities=["Buffalo","Rochester","Syracuse","Albany","Cleveland","Detroit","Columbus","Pittsburgh","Charlotte"],stadiums=["Memorial Stadium","Legacy Field","Victory Stadium","Tiger Stadium","Eagle Field","Warrior Stadium","Panther Park"],coachFirst=["James","Marcus","Derrick","Anthony","Michael","Robert","Daniel","Andre","Chris","Kevin"],coachLast=["Carter","Williams","Johnson","Davis","Thompson","Mitchell","Robinson","Bennett","Jackson","Miller"],schemes=["Balanced","Spread","Pro Style","Air Raid","Power Run","West Coast"],philosophies=["Player Development","Win Now","Discipline","Player Friendly","Tough Love","Analytics"],personalities=["Players' Coach","Demanding","Motivator","Quiet Leader","Old School","Innovator"];
let career=JSON.parse(localStorage.getItem("footballLegacyCareer")||"null")||{},schoolRolls=0,coachRolls=0;const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));function save(){localStorage.setItem("footballLegacyCareer",JSON.stringify(career))}
function home(){career={};save();$("app").innerHTML=`<div class="logo">🏈 FOOTBALL LEGACY</div><div class="subtitle">ONE PLAYER. ONE CAREER. ONE LEGACY.</div><div class="menu"><button class="menu-button" onclick="startCareer()">START NEW CAREER</button><button class="menu-button" onclick="loadCareer()">LOAD CAREER</button><button class="menu-button" onclick="settings()">SETTINGS</button></div><div class="footer">HIGH SCHOOL → COLLEGE → NFL → RETIREMENT</div>`}
function startCareer(){$("app").innerHTML=`<div class="page-title">CREATE YOUR PLAYER</div><div class="subtitle">Your archetype and position are permanent.</div><div class="creation-panel"><h2>PLAYER INFORMATION</h2><label>First Name</label><input id="firstName"><label>Last Name</label><input id="lastName"><label>Birthday</label><input id="birthday" type="date"><label>Hometown</label><input id="hometown"><label>State</label><select id="state"><option value="">Select State</option>${["New York","California","Texas","Florida","Georgia","Ohio","Pennsylvania","Michigan","New Jersey","North Carolina"].map(x=>`<option>${x}</option>`).join("")}</select><label>Handedness</label><select id="handedness"><option>Right</option><option>Left</option><option>Switch Passer</option></select><h2>PHYSICAL BUILD</h2><label>Height</label><input id="height" placeholder="Example: 5'8"><label>Weight (max 500)</label><input id="weight" type="number" min="1" max="500"><label>Jersey Number</label><input id="jersey" type="number" min="0" max="99"><h2>POSITION</h2><select id="position" onchange="updatePosition()"><option value="">Select Position</option>${Object.keys(archetypes).map(x=>`<option>${x}</option>`).join("")}<option value="RANDOM">🎲 Random Position</option></select><label>Archetype</label><select id="archetype"><option>Select a position first</option></select><div class="rating-box"><div class="starting-overall">STARTING OVR <strong>60</strong></div><p>Every player starts at exactly 60 OVR.</p></div><button class="menu-button" onclick="createPlayer()">CONTINUE TO 12 ATTRIBUTES</button><button class="back-button" onclick="home()">← BACK</button></div>`}
function updatePosition(){let p=$("position").value;if(p==="RANDOM"){p=pick(Object.keys(archetypes));$("position").value=p}$("archetype").innerHTML=p&&archetypes[p]?archetypes[p].map(x=>`<option>${x}</option>`).join(""):"<option>Select a position first</option>"}
function createPlayer(){let ids=[["firstName","First Name"],["lastName","Last Name"],["birthday","Birthday"],["hometown","Hometown"],["state","State"],["height","Height"],["weight","Weight"],["jersey","Jersey Number"]],missing=ids.filter(x=>!$(x[0]).value.trim()).map(x=>x[1]);if(!$("position").value||$("position").value==="RANDOM")missing.push("Position");if(!$("archetype").value||$("archetype").value.includes("Select"))missing.push("Archetype");if(missing.length)return alert("Please complete: "+missing.join(", "));let w=+$("weight").value,j=+$("jersey").value;if(w<1||w>500)return alert("Weight must be 1–500 lbs.");if(j<0||j>99)return alert("Jersey number must be 0–99.");career.player={firstName:$("firstName").value.trim(),lastName:$("lastName").value.trim(),birthday:$("birthday").value,hometown:$("hometown").value.trim(),state:$("state").value,handedness:$("handedness").value,height:$("height").value.trim(),weight:w,jersey:j,position:$("position").value,archetype:$("archetype").value,overall:60};attributeScreen()}
function attributeScreen(){let a={};attrs.forEach(x=>a[x]=50);(boosts[career.player.archetype]||[]).forEach(x=>a[x]+=3);career.pending=a;career.spent=0;$("app").innerHTML=`<div class="page-title">ALLOCATE YOUR 12 ATTRIBUTES</div><div class="subtitle">Build your player. Your OVR remains 60.</div><div class="creation-panel"><div class="rating-box"><div class="starting-overall">POINTS LEFT <strong id="left">12</strong></div><p>Archetype boosts are already applied.</p></div><div class="attribute-grid">${attrs.map(x=>`<div class="attribute-card"><strong>${x}</strong><div class="attribute-value"><b id="a-${x.replaceAll(" ","-")}">${a[x]}</b><div class="plusminus"><button onclick="changeAttr('${x}',-1)">−</button><button onclick="changeAttr('${x}',1)">+</button></div></div></div>`).join("")}</div><button class="menu-button" onclick="confirmAttrs()">CONFIRM 12 POINTS</button><button class="back-button" onclick="startCareer()">← BACK</button></div>`}
function changeAttr(n,d){let base=50+(boosts[career.player.archetype]||[]).filter(x=>x===n).length*3;if(d>0&&career.spent>=12)return;if(d<0&&career.pending[n]<=base)return;career.pending[n]+=d;career.spent+=d;$("left").textContent=12-career.spent;$(`a-${n.replaceAll(" ","-")}`).textContent=career.pending[n]}
function confirmAttrs(){if(career.spent!==12)return alert("You must allocate all 12 points.");career.player.attributes={...career.pending};delete career.pending;delete career.spent;schoolScreen()}
function schoolScreen(){schoolRolls=0;$("app").innerHTML=`<div class="page-title">CREATE YOUR SCHOOL</div><div class="subtitle">Build it yourself or generate it.</div><div class="creation-panel"><div class="random-box"><button id="schoolRandom" class="menu-button" onclick="randomSchool()">🎲 RANDOMLY GENERATE SCHOOL</button><div id="schoolStatus" class="random-status">Initial generation + 3 regenerations.</div></div><h2>SCHOOL</h2><label>Name</label><input id="schoolName"><label>City</label><input id="schoolCity"><label>State</label><input id="schoolState"><label>Mascot</label><input id="schoolMascot"><label>Stadium</label><input id="stadium"><h2>COLORS</h2><div class="grid"><div><label>Primary</label><input id="primary" type="color" value="#1e3a5f"></div><div><label>Secondary</label><input id="secondary" type="color" value="#ffffff"></div><div><label>Accent</label><input id="accent" type="color" value="#d4af37"></div></div><h2>PROGRAM</h2><label>School Strength</label><select id="schoolStrength"><option value="1">⭐ Rebuilding</option><option value="2">⭐⭐ Developing</option><option value="3" selected>⭐⭐⭐ Competitive</option><option value="4">⭐⭐⭐⭐ State Contender</option><option value="5">⭐⭐⭐⭐⭐ National Powerhouse</option></select><label>Rival</label><input id="rival"><button class="menu-button" onclick="saveSchool()">CONTINUE TO COACH</button><button class="back-button" onclick="attributeScreen()">← BACK</button></div>`}
function randomSchool(){if(schoolRolls>=4)return;let hex=()=>"#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0"),v=[pick(schoolNames)+" High School",pick(cities),pick(["New York","Ohio","Michigan","Pennsylvania","North Carolina","Georgia","Florida","Texas"]),pick(mascots),pick(stadiums),hex(),hex(),hex(),ri(1,5),pick(schoolNames)+" High School"];["schoolName","schoolCity","schoolState","schoolMascot","stadium","primary","secondary","accent","schoolStrength","rival"].forEach((id,i)=>$(id).value=v[i]);schoolRolls++;let left=4-schoolRolls;$("schoolRandom").textContent=left?"🔄 REGENERATE SCHOOL":"🎲 GENERATIONS USED";$("schoolRandom").disabled=!left;$("schoolStatus").textContent=left+" regeneration"+(left===1?"":"s")+" remaining."}
function saveSchool(){let req=[["schoolName","School Name"],["schoolCity","City"],["schoolState","State"],["schoolMascot","Mascot"],["stadium","Stadium"]],miss=req.filter(x=>!$(x[0]).value.trim()).map(x=>x[1]);if(miss.length)return alert("Please complete: "+miss.join(", "));career.school={name:$("schoolName").value.trim(),city:$("schoolCity").value.trim(),state:$("schoolState").value,mascot:$("schoolMascot").value.trim(),stadium:$("stadium").value.trim(),primary:$("primary").value,secondary:$("secondary").value,accent:$("accent").value,strength:+$("schoolStrength").value,rival:$("rival").value.trim()||"Central High School",classification:pick(["AAA","AA","A","B","C","D"])};coachScreen()}
function coachScreen(){$("app").innerHTML=`<div class="page-title">CREATE YOUR COACH</div><div class="subtitle">Your coach shapes opportunities, development and scheme fit.</div><div class="creation-panel"><div class="random-box"><button id="coachRandom" class="menu-button" onclick="randomCoach()">🎲 RANDOMLY GENERATE COACH</button><div id="coachStatus" class="random-status">Initial generation + 3 regenerations.</div></div><label>First Name</label><input id="coachFirst"><label>Last Name</label><input id="coachLast"><label>Age</label><input id="coachAge" type="number" min="25" max="80"><label>Scheme</label><select id="coachScheme">${schemes.map(x=>`<option>${x}</option>`).join("")}</select><label>Philosophy</label><select id="coachPhilosophy">${philosophies.map(x=>`<option>${x}</option>`).join("")}</select><label>Player Development</label><select id="coachDevelopment"><option value="1">⭐</option><option value="2">⭐⭐</option><option value="3" selected>⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="5">⭐⭐⭐⭐⭐</option></select><label>Strictness</label><select id="coachStrictness"><option value="1">Low</option><option value="2">Moderate</option><option value="3" selected>High</option><option value="4">Very High</option><option value="5">Extreme</option></select><label>Personality</label><select id="coachPersonality">${personalities.map(x=>`<option>${x}</option>`).join("")}</select><button class="menu-button" onclick="saveCoach()">CONTINUE TO CAREER</button><button class="back-button" onclick="schoolScreen()">← BACK</button></div>`}
function randomCoach(){let v=[pick(coachFirst),pick(coachLast),ri(30,58),pick(schemes),pick(philosophies),ri(1,5),ri(1,5),pick(personalities)];["coachFirst","coachLast","coachAge","coachScheme","coachPhilosophy","coachDevelopment","coachStrictness","coachPersonality"].forEach((id,i)=>$(id).value=v[i]);coachRolls++;let left=4-coachRolls;$("coachRandom").textContent=left?"🔄 REGENERATE COACH":"🎲 GENERATIONS USED";$("coachRandom").disabled=!left;$("coachStatus").textContent=left+" regeneration"+(left===1?"":"s")+" remaining."}

function careerHub(){career.hs.campComplete?hub():campHub()}
function campHub(){let h=career.hs;$("app").innerHTML=`<div class="page-title">FALL CAMP</div><div class="subtitle">Earn your role. JV is temporary.</div><div class="grid"><div class="stat-card"><span>OVR</span><b>60</b></div><div class="stat-card"><span>ENERGY</span><b>${h.energy}/${h.energyCap}</b></div><div class="stat-card"><span>COACH TRUST</span><b>${Math.round(h.coachTrust)}</b></div><div class="stat-card"><span>CONFIDENCE</span><b>${Math.round(h.confidence)}</b></div><div class="stat-card"><span>CHEMISTRY</span><b>${Math.round(h.chemistry)}</b></div><div class="stat-card"><span>CAMP SCORE</span><b>${Math.round(h.fallCampScore)}</b></div></div><div class="panel"><h2>DEVELOPMENT</h2><div class="activity-grid"><div class="activity-card"><h3>🎥 Film Room</h3><p>Study your role and tendencies.</p><button class="menu-button" onclick="campAct('film')">FILM • 20</button></div><div class="activity-card"><h3>🏈 Field Work</h3><p>Position drills with a small chance of an attribute boost.</p><button class="menu-button" onclick="campAct('field')">FIELD • 30</button></div><div class="activity-card"><h3>🏋️ Weight Room</h3><p>Physical development.</p><button class="menu-button" onclick="campAct('weight')">WEIGHT • 30</button></div><div class="activity-card"><h3>🧠 Recovery</h3><p>Restore Energy.</p><button class="menu-button" onclick="campAct('recovery')">RECOVER • 15</button></div></div><div id="campLog" class="result">Use your 100 Energy strategically.</div></div><button class="menu-button" onclick="finishCamp()">FINISH FALL CAMP</button>`}
function campAct(type){let h=career.hs,c={film:20,field:30,weight:30,recovery:15}[type];if(h.energy<c)return alert("Not enough Energy.");h.energy-=c;let msg="";if(type==='film'){h.coachTrust=Math.min(100,h.coachTrust+ri(2,6));h.fallCampScore+=ri(7,14);msg="You found a useful tendency. Coach Trust increased."}else if(type==='field'){h.fallCampScore+=ri(7,15);h.coachTrust=Math.min(100,h.coachTrust+ri(1,4));if(Math.random()<.65){let k=pick(attrs);career.player.attributes[k]=Math.min(99,career.player.attributes[k]+1);msg=`Field breakthrough: <span class="success">${k} +1</span>`}else msg="Solid field session. No attribute increase this time."}else if(type==='weight'){h.fallCampScore+=ri(6,14);if(Math.random()<.6){let k=pick(["Strength","Power","Stamina","Toughness"]);career.player.attributes[k]=Math.min(99,career.player.attributes[k]+1);msg=`Strong session: <span class="success">${k} +1</span>`}else msg="Good workout. No attribute increase this time."}else{h.energy=Math.min(h.energyCap,h.energy+25);msg="You recovered 25 Energy."}h.fallCampScore=Math.min(100,h.fallCampScore);save();campHub()}
function finishCamp(){let h=career.hs;h.fallCampScore=Math.min(100,h.fallCampScore+Math.floor(h.coachTrust/10));h.level=h.fallCampScore>=75?"Varsity":"JV";h.campComplete=true;h.energy=h.energyCap;if(h.level==='Varsity')h.coachTrust=Math.min(100,h.coachTrust+8);save();hub()}
function hub(){let h=career.hs,week=h.week+1,g=h.schedule[h.week];$("app").innerHTML=`<div class="page-title">FRESHMAN CAREER HUB</div><div class="subtitle">Week ${Math.min(week,9)} • ${h.level} • ${esc(career.school.name)}</div><div class="grid"><div class="stat-card"><span>OVR</span><b>${calcOvr()}</b></div><div class="stat-card"><span>ENERGY</span><b>${h.energy}/${h.energyCap}</b></div><div class="stat-card"><span>CONFIDENCE</span><b>${Math.round(h.confidence)}</b></div><div class="stat-card"><span>COACH TRUST</span><b>${Math.round(h.coachTrust)}</b></div><div class="stat-card"><span>CHEMISTRY</span><b>${Math.round(h.chemistry)}</b></div><div class="stat-card"><span>RECORD</span><b>${h.teamWins}-${h.teamLosses}</b></div></div><div class="tabs"><button onclick="playerTab()">PLAYER</button><button onclick="scheduleTab()">SCHEDULE</button><button onclick="trainingTab()">TRAINING</button><button onclick="skillsTab()">SKILLS</button><button onclick="potentialTab()">POTENTIAL</button></div><div class="panel"><h2>NEXT GAME</h2><div class="scoreboard"><div><span>YOU</span><div class="big">${h.level}</div></div><div><span>WEEK ${week}</span><div class="big">VS</div></div><div><span>${esc(g?.name||"Season Complete")}</span><div class="big">${g?.home?"HOME":"AWAY"}</div></div></div><div class="notice">${h.level==='JV'?"Your goal is to get off JV. Strong performance can earn a midseason promotion.":"Varsity playing time depends on performance, trust, chemistry, scheme fit and the depth chart."}</div></div><button class="menu-button" onclick="playNextGame()">PLAY WEEK ${week}</button><button class="menu-button" onclick="simulateWeek()">⏩ SIMULATE WEEK ${week}</button><button class="back-button" onclick="seasonReview()">VIEW SEASON REVIEW</button>`}
function playerTab(){let p=career.player,h=career.hs;$("app").innerHTML=`<div class="page-title">PLAYER</div><div class="subtitle">${esc(p.firstName)} ${esc(p.lastName)}</div><div class="panel"><div class="grid"><div class="stat-card"><span>OVR</span><b>${calcOvr()}</b></div><div class="stat-card"><span>CONFIDENCE</span><b>${Math.round(h.confidence)}</b></div><div class="stat-card"><span>ENERGY</span><b>${h.energy}/${h.energyCap}</b></div><div class="stat-card"><span>COACH TRUST</span><b>${Math.round(h.coachTrust)}</b></div><div class="stat-card"><span>CHEMISTRY</span><b>${Math.round(h.chemistry)}</b></div><div class="stat-card"><span>POSITION</span><b>${p.position}</b></div></div><h2>BIO</h2><p>${esc(p.hometown)}, ${esc(p.state)} • ${esc(p.height)} • ${p.weight} lbs • #${p.jersey}</p><p>Archetype: <b>${esc(p.archetype)}</b> • ${h.classYear} • ${h.level}</p><h2>ATTRIBUTES</h2><div class="grid">${attrs.map(a=>`<div class="stat-card"><span>${a}</span><b>${p.attributes[a]}</b></div>`).join("")}</div><h2>SEASON STATS</h2>${statsTable(h.seasonStats)}</div><button class="menu-button" onclick="hub()">← BACK</button>`}
function trainingTab(){let h=career.hs;$("app").innerHTML=`<div class="page-title">WEEKLY DEVELOPMENT</div><div class="subtitle">Energy resets every week and unused Energy does not carry over.</div><div class="panel"><div class="starting-overall">ENERGY <strong>${h.energy}/${h.energyCap}</strong></div><div class="progress"><div style="width:${100*h.energy/h.energyCap}%"></div></div><div class="activity-grid" style="margin-top:14px"><div class="activity-card"><h3>🎥 Film</h3><p>Preparation and Coach Trust.</p><button class="menu-button" onclick="weekAct('film')">SPEND 20</button></div><div class="activity-card"><h3>🏈 Field</h3><p>Position development.</p><button class="menu-button" onclick="weekAct('field')">SPEND 30</button></div><div class="activity-card"><h3>🏋️ Weight Room</h3><p>Physical development.</p><button class="menu-button" onclick="weekAct('weight')">SPEND 30</button></div><div class="activity-card"><h3>🧠 Recovery</h3><p>Restore Energy.</p><button class="menu-button" onclick="weekAct('recovery')">SPEND 15</button></div></div></div><button class="menu-button" onclick="hub()">← BACK</button>`}
function weekAct(type){let h=career.hs,c={film:20,field:30,weight:30,recovery:15}[type];if(h.energy<c)return alert("Not enough Energy.");h.energy-=c;if(type==='film'){h.coachTrust=Math.min(100,h.coachTrust+ri(1,4));h.confidence=Math.min(100,h.confidence+ri(0,2))}if(type==='field'&&Math.random()<.55){let k=pick(attrs);career.player.attributes[k]=Math.min(99,career.player.attributes[k]+1)}if(type==='weight'&&Math.random()<.5){let k=pick(["Strength","Power","Stamina","Toughness"]);career.player.attributes[k]=Math.min(99,career.player.attributes[k]+1)}if(type==='recovery')h.energy=Math.min(h.energyCap,h.energy+25);save();trainingTab()}
function scheduleTab(){let h=career.hs;$("app").innerHTML=`<div class="page-title">SCHEDULE</div><div class="subtitle">9 regular-season games</div><div class="panel">${h.schedule.map((g,i)=>`<div class="schedule-row ${i===h.week?'current':''}"><span><b>Week ${i+1}</b> • ${g.home?'vs':'@'} ${esc(g.name)}${g.rival?' • 🔥 RIVALRY':''}</span><span>${g.result||"—"}</span></div>`).join("")}<div class="notice">Home-field advantage is based on team chemistry: <b>-2% to +3.5%</b>.</div></div><button class="menu-button" onclick="hub()">← BACK</button>`}
function skillList(pos){const common=["Clutch","Consistency","Football IQ","Toughness","Discipline","Recovery","Two-Way Player","Film Mastery","Big Moment","Pressure Proof","Leader","Durable"];const map={QB:["Pocket Presence","Quick Release","Field Vision","Clutch Thrower","Scramble Threat","Play Action Master","Deep Ball","Short Game","Decision Maker","Pressure Proof","Red Zone Mind","Leader"],RB:["Contact Balance","Elusiveness","Ball Security","Vision","YAC","Pass Protection","Receiving Back","Goal Line","Cutback Runner","Open Field","Clutch Runner","Two-Way Player"],WR:["Release Specialist","Route Runner","Separation","Hands","YAC","Deep Threat","Red Zone","Contested Catch","Slot Technician","Blocking","Return Threat","Clutch Receiver"],TE:["Hands","Route Runner","Blocking","Red Zone","Contested Catch","YAC","Release","Pass Protection","Seam Threat","Physicality","Clutch TE","Two-Way Player"],OT:["Pass Protector","Run Blocker","Anchor","Footwork","Puller","Screen Blocker","Power","Technique","Awareness","Finisher","Penalty Control","Clutch Blocker"],OG:["Power Blocker","Puller","Pass Protector","Anchor","Second Level","Screen Blocker","Technique","Awareness","Finisher","Short Yardage","Penalty Control","Clutch Blocker"],C:["Line Calls","Pass Protector","Run Blocker","Anchor","Snapper","Awareness","Puller","Screen Blocker","Technique","Finisher","Penalty Control","Clutch Center"],EDGE:["Speed Rush","Power Rush","Bend","Run Defense","Block Shed","Tackle","Pursuit","Bull Rush","Swim","Club","Strip Sack","Clutch Rusher"],DT:["Power Rush","Run Stuff","Block Shed","Interior Rush","Anchor","Tackle","Pursuit","Bull Rush","Swim","Club","Strip Sack","Clutch DT"],"Mike LB":["Run Stopper","Field General","Tackling","Blitz","Coverage","Pursuit","Block Shed","Hit Power","Zone IQ","Man IQ","Clutch Defender","Two-Way Player"],"Sam LB":["Edge Setter","Coverage","Blitz","Tackling","Pursuit","Block Shed","Speed","Zone IQ","Man IQ","Hit Power","Clutch Defender","Two-Way Player"],"Will LB":["Coverage","Speed","Tackling","Pursuit","Blitz","Block Shed","Zone IQ","Man IQ","Hit Power","Open Field","Clutch Defender","Two-Way Player"],CB:["Man Coverage","Zone Coverage","Press","Ball Hawk","Recovery","Tackling","Speed","Route Read","Jam","PBU","Clutch DB","Return Threat"],FS:["Center Fielder","Zone","Man","Ball Hawk","Tackling","Pursuit","Range","Route Read","Hit Power","PBU","Clutch Safety","Return Threat"],SS:["Box Safety","Enforcer","Man","Zone","Tackling","Pursuit","Hit Power","Blitz","Run Fit","PBU","Clutch Safety","Two-Way Player"],K:["Power Leg","Accuracy","Kickoff","Clutch Kicker","Long Range","Pressure Proof","Wind Reader","Consistency","Onside","Placement","Big Moment","Recovery"],P:["Power Leg","Accuracy","Directional","Hang Time","Inside 20","Pressure Proof","Weather Reader","Consistency","Fake Punt","Placement","Big Moment","Recovery"]};return map[pos]||common}
function tierFor(v){return v>=100?"Diamond":v>=65?"Gold":v>=35?"Silver":v>=10?"Bronze":"Locked"}
function skillsTab(){let list=skillList(career.player.position),h=career.hs;$("app").innerHTML=`<div class="page-title">SKILL TREE</div><div class="subtitle">Equip up to 5. Unlocks are cheap; higher tiers are harder.</div><div class="skill-grid">${list.map(s=>{let on=h.skills.includes(s),tier=on?tierFor(h.skillProgress[s]||0):"Locked";return `<div class="skill-card"><h3>${esc(s)}</h3><div class="tier ${tier==='Locked'?'locked':''}">${tier}</div><p>Provides a small specialized boost when equipped.</p>${on?`<button class="menu-button" disabled>EQUIPPED</button>`:`<button class="menu-button" onclick="unlockSkill(${JSON.stringify(s)})">UNLOCK • 15 ENERGY</button>`}</div>`}).join("")}</div><div class="notice">You may change your equipped five at the end of each season. Skills stay unlocked.</div><button class="menu-button" onclick="hub()">← BACK</button>`}
function unlockSkill(s){let h=career.hs;if(h.energy<15)return alert("You need 15 Energy.");if(h.skills.includes(s))return;if(h.skills.length>=5)return alert("You can equip only 5 skills until the season ends.");h.energy-=15;h.skills.push(s);h.skillProgress[s]=5;save();skillsTab()}
function potentialTab(){let h=career.hs;$("app").innerHTML=`<div class="page-title">POTENTIAL TREE</div><div class="subtitle">Quests grant Potential Points. Max Energy cap is 200.</div><div class="panel"><div class="stat-card"><span>POTENTIAL POINTS</span><b>${h.potentialPoints}</b></div><div class="skill-grid">${[["Training Capacity","Increase Energy cap by 10."],["Fast Learner","Small development bonus."],["Film Mastery","Film becomes more effective."],["Two-Way Player","Unlock a two-way path."],["Recovery Specialist","Recovery becomes more effective."],["High Motor","Small consistency boost."]].map(x=>`<div class="skill-card"><h3>${x[0]}</h3><p>${x[1]}</p><button class="menu-button" ${h.potentialPoints<1?'disabled':''} onclick="unlockPotential(${JSON.stringify(x[0])})">UNLOCK • 1 POINT</button></div>`).join("")}</div><div class="notice">Potential Tree access lasts from High School Freshman through College Freshman.</div></div><button class="menu-button" onclick="hub()">← BACK</button>`}
function unlockPotential(name){let h=career.hs;if(h.potentialPoints<1)return;h.potentialPoints--;if(name==='Training Capacity')h.energyCap=Math.min(200,h.energyCap+10);save();potentialTab()}
function makeSchedule(){let r=career.school?.rival||"Central High School",a=[];for(let i=0;i<9;i++){let n=i===3?r:pick(schoolNames)+" High School";a.push({name:n,home:i%2===0,rival:i===3,result:null})}return a}
function initStats(){return {games:0,snaps:0,rushAtt:0,rushYds:0,rushTD:0,rec:0,targets:0,recYds:0,recTD:0,drops:0,fumbles:0,passCmp:0,passAtt:0,passYds:0,passTD:0,ints:0,tackles:0,tfl:0,sacks:0,qbHits:0,pbu:0,intsDef:0,ff:0,pancakes:0,sacksAllowed:0,pressuresAllowed:0,runWins:0,passWins:0,penalties:0,krYds:0,prYds:0,stTkl:0}}
function statsTable(s){return `<div class="table-wrap"><table class="stats-table"><tr><th>G</th><th>Snaps</th><th>Rush</th><th>Rush Yds</th><th>Rush TD</th><th>Rec</th><th>Rec Yds</th><th>Rec TD</th><th>Tkl</th><th>Sacks</th><th>INT</th><th>PBU</th><th>Pancakes</th></tr><tr><td>${s.games}</td><td>${s.snaps}</td><td>${s.rushAtt}</td><td>${s.rushYds}</td><td>${s.rushTD}</td><td>${s.rec}</td><td>${s.recYds}</td><td>${s.recTD}</td><td>${s.tackles}</td><td>${s.sacks}</td><td>${s.intsDef}</td><td>${s.pbu}</td><td>${s.pancakes}</td></tr></table></div>`}
function calcOvr(){let a=career.player.attributes,p=career.player.position,w={QB:["Awareness","Football IQ","Technique","Discipline","Power","Speed"],RB:["Speed","Acceleration","Agility","Power","Awareness","Football IQ"],WR:["Speed","Acceleration","Agility","Technique","Awareness"],TE:["Strength","Power","Technique","Awareness","Speed","Toughness"],OT:["Strength","Power","Technique","Awareness","Toughness"],OG:["Strength","Power","Technique","Awareness","Toughness"],C:["Strength","Technique","Awareness","Football IQ","Toughness"],EDGE:["Speed","Acceleration","Power","Strength","Technique","Toughness"],DT:["Strength","Power","Technique","Toughness","Awareness"],"Mike LB":["Awareness","Toughness","Strength","Speed","Football IQ","Technique"],"Sam LB":["Speed","Awareness","Agility","Technique","Toughness","Football IQ"],"Will LB":["Speed","Agility","Awareness","Football IQ","Technique","Toughness"],CB:["Speed","Agility","Technique","Awareness","Football IQ"],FS:["Speed","Awareness","Football IQ","Technique","Agility"],SS:["Strength","Toughness","Awareness","Technique","Speed"],K:["Power","Technique","Discipline","Football IQ"],P:["Power","Technique","Discipline","Awareness"]}[p]||attrs,avg=w.reduce((x,k)=>x+(a[k]||50),0)/w.length;return Math.max(60,Math.min(99,Math.round(60+(avg-50)*.8)))}
function role(){return {QB:"QB",RB:"RB",FB:"RB",WR:"WR",TE:"TE",OT:"OL",OG:"OL",C:"OL",EDGE:"DL",DT:"DL","Mike LB":"LB","Sam LB":"LB","Will LB":"LB",CB:"DB",FS:"DB",SS:"DB",K:"K",P:"P"}[career.player.position]||"RB"}
function gameMultiplier(){let h=career.hs,g=h.schedule[h.week];return g?.home?1+Math.max(-.02,Math.min(.035,(h.chemistry-50)/1400)):1}
function playNextGame(){if(career.hs.week>=9)return postseason();playGame()}
function simulateWeek(){if(career.hs.week>=9)return postseason();if(!confirm("⚠️ SIMULATE WEEK? Injuries, role changes, events and performance can still happen."))return;playGame()}
function genericPlay(){return pick(["run for 3 yards.","pass complete for 7 yards.","incomplete pass.","run stopped for 2 yards.","pass complete for 11 yards.","penalty, 5 yards.","punt.","defensive stop.","rush for 5 yards.","pass incomplete."])}
function playerPlay(s,r){let n=esc(career.player.lastName),a=career.player.attributes,x=Math.random();if(r==='RB'){if(x<.6){let y=ri(1,14)+(a.Speed>65?ri(0,5):0);s.rushAtt++;s.rushYds+=y;if(x<.06){s.rushTD++;return `<span class="you">${n} rushes for ${y} yards — TOUCHDOWN!</span>`}return `<span class="you">${n} takes the handoff for ${y} yards.</span>`}let y=ri(2,12);s.targets++;s.rec++;s.recYds+=y;return `<span class="you">Pass complete to ${n} for ${y} yards.</span>`}if(r==='WR'||r==='TE'){s.targets++;if(x<.22){s.rec++;let y=ri(5,22);s.recYds+=y;if(x<.04){s.recTD++;return `<span class="you">${n} makes the catch for a TOUCHDOWN!</span>`}return `<span class="you">${n} catches a pass for ${y} yards.</span>`}if(x<.27){s.drops++;return `<span class="you">Pass intended for ${n} — DROP.</span>`}return `<span class="you">${n} runs a route and creates separation.</span>`}if(r==='QB'){s.passAtt++;if(x<.62){s.passCmp++;let y=ri(4,22);s.passYds+=y;if(x<.08){s.passTD++;return `<span class="you">${n} throws a TOUCHDOWN pass for ${y} yards.</span>`}return `<span class="you">${n} completes a ${y}-yard pass.</span>`}s.ints+=x<.05?1:0;return `<span class="you">${n} throws an incomplete pass${x<.05?' — INTERCEPTED!':''}.</span>`}if(r==='OL'){let win=Math.random()<.72;s.runWins+=win?1:0;s.passWins+=win?1:0;if(win){s.pancakes++;return `<span class="you">${n} wins his block and opens the lane.</span>`}s.pressuresAllowed++;return `<span class="you">${n} gives up pressure.</span>`}if(r==='DL'){if(x<.35){s.tackles++;if(x<.1)s.tfl++;if(x<.06)s.sacks++;return `<span class="you">${n} makes the tackle${x<.06?' for a SACK':''}.</span>`}return `<span class="you">${n} generates pressure up front.</span>`}if(r==='LB'){s.tackles++;if(x<.18)s.tfl++;return `<span class="you">${n} makes a tackle${x<.18?' for loss':''}.</span>`}if(r==='DB'){if(x<.15){s.pbu++;return `<span class="you">${n} breaks up the pass.</span>`}s.tackles++;return `<span class="you">${n} makes a defensive tackle.</span>`}return `<span class="you">${n} contributes on special teams.</span>`}
function applyStats(s,r){if(r==='RB'&&!s.rushAtt){s.rushAtt=ri(5,12);s.rushYds=s.rushAtt*ri(3,7);if(Math.random()<.2)s.rushTD=1}if(r==='WR'&&!s.targets){s.targets=ri(2,8);s.rec=Math.floor(s.targets*.65);s.recYds=s.rec*ri(7,13)}if(r==='TE'&&!s.targets){s.targets=ri(1,6);s.rec=Math.floor(s.targets*.65);s.recYds=s.rec*ri(6,12)}if(r==='OL'){s.pancakes+=ri(1,6);s.runWins+=ri(5,12);s.passWins+=ri(5,12)}if(r==='LB'||r==='DB')s.tackles+=ri(2,7);if(r==='DL'){s.tackles+=ri(1,5);if(Math.random()<.25)s.sacks++}}
function merge(a,b){Object.keys(b).forEach(k=>{if(typeof b[k]==='number')a[k]=(a[k]||0)+b[k]});return a}
function perf(s,r){let x=55;if(r==='RB')x+=s.rushYds/10+s.rushTD*10+s.recYds/20-s.fumbles*8;if(r==='WR'||r==='TE')x+=s.recYds/12+s.recTD*10-s.drops*7;if(r==='OL')x+=s.pancakes*2+s.runWins+s.passWins-s.pressuresAllowed*2;if(r==='DL')x+=s.tackles+s.tfl*3+s.sacks*5;if(r==='LB'||r==='DB')x+=s.tackles+s.tfl*3+s.sacks*5+s.pbu*2;return Math.max(0,Math.min(100,Math.round(x)))}
function playGame(){let h=career.hs,g=h.schedule[h.week],s=initStats(),team=0,opp=0,logs=[],r=role(),m=gameMultiplier();for(let q=1;q<=4;q++){let tq=Math.round(ri(0,14)*m),oq=ri(0,14);team+=tq;opp+=oq;logs.push(`<div class="qhead">${q}Q — ${team}-${opp}</div>`);for(let i=0;i<ri(10,16);i++){let involved=Math.random()<(h.level==='Varsity'?.24:.10)+(h.coachTrust/1000);logs.push(`<div class="play">${involved?playerPlay(s,r):genericPlay()}</div>`)}}let won=team>opp;if(team===opp){opp++;won=false}g.result=`${won?'W':'L'} ${team}-${opp}`;h.week++;h.teamWins+=won?1:0;h.teamLosses+=won?0:1;s.games=1;s.snaps=ri(18,65);if(h.level==='Varsity')h.varsityGames++;h.filmGames+=h.level==='Varsity'?1:0;h.snaps+=s.snaps;applyStats(s,r);h.seasonStats=merge(h.seasonStats,s);h.weeklyStats.push({week:h.week,opponent:g.name,score:`${team}-${opp}`,win:won,stats:s});let ps=perf(s,r);h.confidence=Math.max(0,Math.min(100,h.confidence+(won?ri(2,6):-ri(1,5))));h.coachTrust=Math.max(0,Math.min(100,h.coachTrust+(ps>65?ri(2,6):-ri(0,3))));h.chemistry=Math.max(0,Math.min(100,h.chemistry+(won?1:-1)+(ps>70?1:0)));if(h.level==='JV'&&ps>72&&h.coachTrust>65&&Math.random()<.45){h.level='Varsity';h.coachTrust=Math.min(100,h.coachTrust+8)}h.energy=h.energyCap;weeklyEvent();save();postGame(team,opp,won,logs,s)}
function postGame(team,opp,won,logs,s){let h=career.hs;$("app").innerHTML=`<div class="page-title">${won?'🏆 VICTORY':'FINAL SCORE'}</div><div class="subtitle">${h.week>=9?'FINAL REGULAR SEASON':'WEEK '+h.week}</div><div class="panel"><div class="scoreboard"><div><span>${esc(career.school.name)}</span><div class="big">${team}</div></div><div><span>FINAL</span><div class="big">${won?'W':'L'}</div></div><div><span>${esc(h.schedule[h.week-1].name)}</span><div class="big">${opp}</div></div></div><h2>PLAY-BY-PLAY</h2><div class="playlog">${logs.join("")}</div></div><div class="panel"><h2>YOUR STATS</h2>${statsTable(s)}<div class="notice">Performance: ${perf(s,role())}/100 • Coach Trust: ${Math.round(h.coachTrust)} • Confidence: ${Math.round(h.confidence)}</div><h2>TEAM / OPPONENT</h2><div class="two"><div class="stat-card"><span>TEAM</span><b>${team} points • ${h.teamWins}-${h.teamLosses}</b></div><div class="stat-card"><span>OPPONENT</span><b>${opp} points</b></div></div></div><button class="menu-button" onclick="afterGame()">CONTINUE</button>`}
function afterGame(){if(career.hs.week>=9)return postseason();career.hs.energy=career.hs.energyCap;randomEvent();save();hub()}
function randomEvent(){let h=career.hs,e=pick(["A teammate compliments your work ethic. Chemistry +2.","Your coach gives you extra film advice. Coach Trust +2.","A local reporter mentions your performance. Confidence +2.","A teammate asks you to stay late and work. Chemistry +1.","You have a quiet week. No major event."]);if(e.includes("Chemistry +2"))h.chemistry=Math.min(100,h.chemistry+2);if(e.includes("Chemistry +1"))h.chemistry=Math.min(100,h.chemistry+1);if(e.includes("Trust +2"))h.coachTrust=Math.min(100,h.coachTrust+2);if(e.includes("Confidence +2"))h.confidence=Math.min(100,h.confidence+2);h.events.push(e);if(Math.random()<.15){h.potentialPoints+=1;h.awards.push("Potential Quest Completed")}save()}
function weeklyEvent(){if(Math.random()<.18)career.hs.events.push("A random weekly event occurred.")}
function postseason(){let h=career.hs;if(h.varsityGames<5)return endCareer(`You finished high school without enough varsity film. Varsity film: ${h.varsityGames}/5.`);if(h.teamWins<5)return seasonReview();h.playoff=true;let wins=0,rounds=[];for(let i=0;i<4;i++){let w=Math.random()<(.48+h.teamWins*.03);rounds.push(w);if(w)wins++;else break}$("app").innerHTML=`<div class="page-title">🏆 STATE PLAYOFFS</div><div class="subtitle">Class ${career.school.classification}</div><div class="panel">${rounds.map((w,i)=>`<div class="schedule-row"><b>${["Regional","Quarterfinal","Semifinal","State Championship"][i]}</b><span class="${w?'success':'danger'}">${w?'WIN':'LOSS'}</span></div>`).join("")}<div class="notice">${wins===4?'<span class="gold"><b>STATE CHAMPIONS!</b></span>':'Your playoff run has ended.'}</div></div><button class="menu-button" onclick="seasonReview()">FRESHMAN SEASON REVIEW</button>`}
function seasonReview(){let h=career.hs;if(!h.seasonDone){h.seasonDone=true;if(h.varsityGames>=5&&Math.random()<.35)h.potentialPoints++;save()}$("app").innerHTML=`<div class="page-title">🏆 FRESHMAN SEASON REVIEW</div><div class="subtitle">The first chapter is complete.</div><div class="panel"><div class="grid"><div class="stat-card"><span>FINAL RECORD</span><b>${h.teamWins}-${h.teamLosses}</b></div><div class="stat-card"><span>VARSITY GAMES</span><b>${h.varsityGames}/5</b></div><div class="stat-card"><span>FINAL OVR</span><b>${calcOvr()}</b></div><div class="stat-card"><span>COACH TRUST</span><b>${Math.round(h.coachTrust)}</b></div><div class="stat-card"><span>CONFIDENCE</span><b>${Math.round(h.confidence)}</b></div><div class="stat-card"><span>POTENTIAL POINTS</span><b>${h.potentialPoints}</b></div></div><h2>SEASON STATISTICS</h2>${statsTable(h.seasonStats)}<h2>SKILLS</h2>${h.skills.map(s=>`<span class="pill">${esc(s)} • ${tierFor(h.skillProgress[s]||0)}</span>`).join("")}<h2>AWARDS / ACHIEVEMENTS</h2><div class="notice">${h.awards.length?h.awards.map(x=>`<div>🏅 ${esc(x)}</div>`).join(""):"No major awards yet."}</div></div><button class="menu-button" onclick="offseason()">ENTER SOPHOMORE OFFSEASON</button>`}
function offseason(){let h=career.hs;h.classYear="Sophomore";h.year=2;h.week=0;h.energy=h.energyCap;h.seasonStats=initStats();h.weeklyStats=[];h.schedule=makeSchedule();h.teamWins=0;h.teamLosses=0;h.varsityGames=0;h.seasonDone=false;h.level="Varsity";save();$("app").innerHTML=`<div class="page-title">SOPHOMORE YEAR</div><div class="subtitle">Your first offseason is complete.</div><div class="panel"><h2>SKILL LOADOUT</h2><p>You can change your five equipped skills at the end of each season. Unlocked skills remain available.</p><button class="menu-button" onclick="skillsTab()">MANAGE SKILLS</button></div><button class="menu-button" onclick="hub()">ENTER SOPHOMORE HUB</button>`}
function endCareer(reason){career.hs.careerAlive=false;save();$("app").innerHTML=`<div class="page-title">CAREER ENDED</div><div class="panel"><h2 class="danger">${esc(reason)}</h2><p>You can start a new career from the home screen.</p></div><button class="menu-button" onclick="home()">START OVER</button>`}
function loadCareer(){if(!career.player)return alert("No saved career found.");if(!career.hs)return alert("Saved career is incomplete.");hub()}
function settings(){let c=prompt("Play-by-play highlight color (hex):",career.hs?.highlightColor||"#ff4040");if(c&&/^#[0-9a-fA-F]{6}$/.test(c)){if(career.hs)career.hs.highlightColor=c;save();alert("Highlight color saved.")}}
if(career.player&&career.hs)hub();else home();
</script></body></html>
